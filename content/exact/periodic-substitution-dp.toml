id = "periodic-substitution-dp"
section = "exact"
title = "Periodic-substitution dynamic programming"
subtitle = "Optimize frozen additive, Porta, or affine key shortlists and compare them with within-coset nulls"
status = "VERIFIED"
status_note = "The cyclic dynamic program is exact within each frozen per-residue shortlist. Additive and Porta controls passed at the stated lengths; period-7 affine controls passed, but the period-26 affine control selected a false readable state. The shortlist plus local polish is not a global search of the full key product, so the recorded low scores are empirical screen results rather than exact family exclusions."
family = "Dynamic programming"
tags = ["periodic key", "cyclic DP", "shortlist", "within-coset null", "porta", "affine"]
related = ["viterbi-decoding", "exact-dynamic-programming", "k-best-lists", "coordinate-descent", "vigenere", "beaufort", "porta", "affine-cipher", "affine-maps-mod-26", "within-coset-null", "valid-model-nulls", "planted-controls", "g-coset", "periodic-key-marginal-likelihood"]
summary = "Given a text zone and period, single-letter likelihood makes a finite map shortlist for each residue. A cyclic quadgram dynamic program finds the exact best key within that Cartesian product. A subsequent coordinate and adjacent-pair polish is local search: it may add omitted maps but does not certify the optimum over the unrestricted key family. Within-coset shuffles calibrate the same selected pipeline empirically."
updated = "2026-09-07"

[[blocks]]
kind = "definition"
body = '''
For residue $b$, alphabet order $A$ and candidate map $s$:

```
shortlist:  L_b(s) = sum_{i = b mod p} ln E( A[ map_s^{-1}(a(C_i)) ] );  keep the W = 8 best s per residue
tables:     Phi_r(k_r, k_{r+1}, k_{r+2}, k_{r+3}) = sum_{i = r mod p} log10 Q4(P_i P_{i+1} P_{i+2} P_{i+3})
DP:         V_t(b,c,d) = max_a [ V_{t-1}(a,b,c) + Phi_{t-3}(a,b,c,d) ], exact closure by enumerating (k_0,k_1,k_2)
polish:     unrestricted 26-way (or 13-way / 312-way) coordinate and adjacent-pair pass over all maps
verdict:    ENGLISH only above a pre-declared rate; null = max over orders and relations of the same solve on
            ciphertexts shuffled within each period coset
```

Families: additive ($P_i = A[(a(C_i) - k_b) \bmod 26]$ or $A[(k_b - a(C_i)) \bmod 26]$); Porta with $t = k_b \in \mathbb{Z}_{13}$ ($a(P_i) = 13 + (x + t) \bmod 13$ if $x = a(C_i) < 13$, else $(x - 13 - t) \bmod 13$; reciprocal, and a sign-reversed tableau is absorbed by $t \mapsto -t$); affine per residue ($a(P_i) = m_b\, a(C_i) + d_b$, $\gcd(m_b, 26) = 1$, $312$ maps).
'''

[[blocks]]
kind = "equations"
body = '''
Monogram shortlist (Vigenère): $L_b(s)=\sum_{i\equiv b}\ln E(A[(a(C_i)-s)\bmod26])$. The eight highest $s$ per residue enter the DP. A within-coset shuffle preserves each coset histogram and every statistic determined only by those histograms, while disrupting the original positional order and cross-coset sequential dependence. Re-running the complete selected pipeline on such shuffles calibrates that null; it does not prove that adjacency is the only destroyed structure.
'''

[[blocks]]
kind = "assumptions"
title = "Assumptions and invariants"
body = '''
- The zone and period are test readings (change points, periodic index of coincidence), not narrative inputs. The DP does not assume a word key.
- Config equality on controls is judged on observed coset symbols only, so unobserved affine actions that are equivalent on the data do not produce a false failure.
- A roundtrip proves model consistency only: every state below reproduces its ciphertext exactly.
'''

[[blocks]]
kind = "attack"
title = "How to attack it"
body = '''
The recorded pipeline tested the named lengths, periods, two alphabet orders, and two relations. Its finishes are empirical outcomes of a width-eight shortlist followed by local polish. Falling below a frozen language trigger, or below the maximum of a small diagnostic null panel, means the pipeline found no lead; it does not prove that no full-family key exists. A formal negative would require exhaustive coverage of the unrestricted per-residue map product or an admissible certificate dominating every omitted key.
'''

[[blocks]]
kind = "pseudocode"
body = '''
```text
// Inputs: ciphertext zone C of n letters, period p, alphabet order A,
// relation; shortlist width W = 8.
function SHORTLIST(C, p, A, b):                      // residue b
    for each candidate map s:
        L_b(s) = sum over i with i mod p == b of ln E( A[ map_s^{-1}(a(C_i))
                ] )
    return the W maps s with the largest L_b(s)

function PERIODIC_DP(C, p, A):
    for b in 0..p-1: S[b] = SHORTLIST(C, p, A, b)
    // quadgram tables over the shortlists, indices mod p
    for r in 0..p-1:
        for each (k_r, k_{r+1}, k_{r+2}, k_{r+3}) in S[r] x S[r+1] x S[r+2] x
                S[r+3]:
            Phi_r(k_r, ..., k_{r+3}) = sum over i with i mod p == r of log10
                    Q4(P_i P_{i+1} P_{i+2} P_{i+3})
    best = -inf
    // exact cyclic closure
    for each start (k_0, k_1, k_2) in S[0] x S[1] x S[2]:
        V_2(k_0, k_1, k_2) = 0
        for t in 3..p-1:
            V_t(b, c, d) = max over a in S[t-3] of [ V_{t-1}(a, b, c) +
                    Phi_{t-3}(a, b, c, d) ]
        total = max over (k_{p-3}, k_{p-2}, k_{p-1}) of V_{p-1} plus the
                closing tables Phi_{p-3}, Phi_{p-2}, Phi_{p-1} evaluated with
                the fixed start
                        (k_0, k_1, k_2)
        if total > best: best = total; key = traceback of the argmax choices
    // unrestricted coordinate and adjacent-pair pass
    key = POLISH(C, p, A, key)
    return (key, RATE(DECRYPT(C, key)))

// This returns the exact shortlist optimum followed by a local polish. Any
// empirical label and null comparison applies to that selected pipeline, not
// to keys omitted from the shortlist product.
```
'''

[[blocks]]
kind = "complexity"
body = '''
Per (order, relation, family): $p \cdot 26$ shortlist sums, $p$ tables of $8^4$ entries, the DP over $8^3$ starting triples, and a polish of $p \times 26$ (additive), $p \times 13$ (Porta) or $p \times 312$ (affine) single-coordinate trials plus adjacent pairs. The fast run records five conditional nulls per zone. The full run 39.
'''

[[blocks]]
kind = "failure_modes"
body = '''
- **Wide family, few observations.** At period 26 on 126 letters the affine family (312 maps per residue) manufactured a false state scoring $-4.2767$ that reads as English and roundtrips but is neither the hidden plaintext nor the hidden maps. The additive and Porta families with 26 and 13 options recover the same control exactly. The DP is not at fault. The family is too wide for four to five letters per residue.
- **Attractive overfit.** The period-26 additive finish at $-5.107$ looks partial; its null maximum is $-5.021$. Without the within-coset null it would have been read as signal.
- **Shortlist omission.** A map outside the eight best is unreachable to the exact DP and may remain unreachable after local polish. Therefore a miss is not an exhaustive negative for the unrestricted periodic family.
- **Known order only.** The DP tests two alphabet orders. An unstructured alphabet is outside its scope and belongs to the constraint-programming entries.
'''

[[blocks]]
kind = "controls"
body = '''
Additive: blind controls at 63 letters (period 7), 95 letters (period 7) and 126 letters (period 26) recover 100% of the hidden plaintext and reproduce the ciphertext; control gate PASS before any zone. Porta: n63/p7 straight order, n95/p7 keyword-mixed order, n126/p26 keyword-mixed order, each 100% with exact row keys and forward PASS. Affine: 63/63 and 95/95 at period 7 with exact observed maps and forwards. The n126/p26 control fails as described and its zone stayed locked. Planted controls are generated from a generic corpus and disclosed only after blind inference.
'''

[[blocks]]
kind = "example"
title = "Worked example"
body = '''
Period 2 on an 8-letter toy, shortlist $W = 2$ per residue: residue 0 candidates $\{k_0 = 3, k_0 = 7\}$, residue 1 candidates $\{k_1 = 1, k_1 = 5\}$. The quadgram objective over the eight-letter decrypt depends on both shifts at every quadgram, so with $p = 2$ the chain has a single table $\Phi(k_0, k_1)$ and the exact maximum is the best of the $2 \times 2 = 4$ cells, say $\Phi(3, 1) = -22.0$, $\Phi(3, 5) = -25.5$, $\Phi(7, 1) = -24.1$, $\Phi(7, 5) = -19.8$: the DP returns $(7, 5)$. The coordinate pass then tries all 26 values of $k_0$ with $k_1 = 5$ and all 26 of $k_1$ with $k_0 = 7$. If the planted key were $(7, 9)$ with $9$ outside the shortlist, this pass is what recovers it. For $p \ge 4$ the same computation becomes a genuine chain with $8^3$ states per position instead of a single table.
'''

