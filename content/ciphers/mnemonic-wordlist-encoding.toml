id = "mnemonic-wordlist-encoding"
section = "ciphers"
title = "Mnemonic word-list encoding"
subtitle = "Hide a checksummed phrase from a 2,048-word list under a keyed cipher"
status = "CLOSED"
status_note = "Exact solvers recovered hidden planted mnemonics, their alphabet cycle, and their shifts. Tests covered 12 to 24 words written as unique four-letter prefixes or full words under period-2, -4, or -7 keyed ciphers. Every stated live search finished with zero answers. Other source lists, padded three-letter words, and an unknown alphabet under seven free shifts remain open."
family = "Modern and encoding schemes"
tags = ["mnemonic", "word list", "checksum", "structured key", "exact search"]
related = ["quagmire-iii", "quagmire-iv", "keyword-mixed-alphabet", "word-prefix-csp", "constraint-satisfaction-forward-checking", "modular-inverse-and-crt", "all-different-enumeration", "shared-cycle-attack", "g-mixed-alphabet", "sha256"]
summary = "A standard mnemonic stores 128 to 256 random bits as 12 to 24 words from a fixed list of 2,048. Each word carries 11 bits, and the last word includes a hash checksum. Four letters suffice to identify every list word of length at least four; the 103 three-letter words need a separate fixed-width convention. Exact solvers tested declared layouts beneath repeating keyed ciphers and enforced the checksum as a rule, not just a score."
updated = "2026-09-08"

[[blocks]]
kind = "definition"
body = '''
For $s$ words the mnemonic carries $\mathrm{ENT} = 32s/3$ entropy bits and $\mathrm{CS} = s/3$ checksum bits, the first $\mathrm{CS}$ bits of $\operatorname{SHA256}(\text{entropy})$. The $11s$ bits split into $s$ indices into the list. With four-letter prefixes the plaintext zone is $4s$ letters; 1,945 of the 2,048 English words have at least four letters (103 have three). The cipher layer studied is a Quagmire with one unknown 26-cycle $z$ and shifts $k$ by absolute position:

$$\text{Vigenère: } z(c_i) - z(p_i) - k_{i \bmod m} \equiv 0, \qquad \text{Beaufort: } z(c_i) + z(p_i) - k_{i \bmod m} \equiv 0 \pmod{26}.$$
'''

[[blocks]]
kind = "equations"
title = "Exact search structure"
body = '''
The first $s-1$ words are assigned most-constrained-first. They leave $\mathrm{ENT}-11(s-1)=11-s/3$ entropy bits in the last word: 7 bits for 12 words and 3 bits for 24 words, hence 128 down to 8 possible entropy tails. SHA-256 fixes the checksum bits and therefore the last word's full index for each tail, so the checksum prunes rather than scores. At every node the solver enforces equality and injectivity of each residue map, shared-cycle group identities (Vigenère maps must be restrictions of rotations of one cycle; Beaufort maps of reflections whose pair products are rotations), and homogeneous linear feasibility over $\mathrm{GF}(2)$ and $\mathrm{GF}(13)$ maintained as incremental echelon bases; CRT lifts a residue solution to a permutation of $\mathbb{Z}_{26}$ exactly when each residue is used twice with opposite parity. A cap overrun retains the branch, so caps cannot create false negatives. For period 2 the problem is an affine graph problem: each observed pair adds an edge $z(v)=s_vt+a_v$ and the components are packed exactly into the 26 coordinates.
'''

[[blocks]]
kind = "variants"
body = '''
- **Fixed four-letter prefixes**, 24 words, origin at a measured zone start, period 7 with a measured shift tie $k_2 = k_4 = k_6$ or seven free shifts.
- **Period 4** (word-aligned shifts) and **period 2**, at 12, 15, 18, 21 and 24 words.
- **Key-word-tied shifts** $k_r = z(W_r)$ for a seven-letter key word, 56 cells (4 words, 7 rotations, 2 signs).
- **Full spellings** of 24 words totalling the whole 144-letter text under the four fixed-order alphabet pairs, or under one unknown cycle.
- **Wildcard-padded layouts** (12 + 24 words).
'''

[[blocks]]
kind = "assumptions"
title = "Assumptions and invariants"
body = '''
- The standard English list and checksum rule. A declared word count, block origin and cipher period.
- For words of length at least four, the first four letters identify the list entry uniquely. A fixed four-character layout is lossless only after a padding or escape rule for the 103 shorter words is declared.
- Invariant: an endpoint is accepted only if the checksum passes, $z$ is a permutation, a separately written literal decrypt yields the printed prefixes, and literal re-encryption reproduces every ciphertext letter. These are algebraic cross-checks, and only the checksum and literal replay are independent gates.
'''

[[blocks]]
kind = "assumptions"
title = "Dictionary membership versus a complete encoding"
body = '''
A word-list-restricted running key and a standardized entropy mnemonic are different hypotheses. In BIP-39, permitted entropy lengths determine a checksum, the concatenated bits form 11-bit word indices, and converting the mnemonic to a seed is a separate password-based derivation. Merely finding words in the dictionary does not establish the checksum, index order, bit packing, normalization or seed derivation. A cipher attack using only the words must state that reduced model explicitly.
'''

[[blocks]]
kind = "attack"
title = "How to attack it"
body = '''
1. Freeze the geometry (words, origin, period, tie) and the list hash.
2. Run the compiled most-constrained-first DFS with split prefixes scheduled by the size of the next domain; stop at the first verified endpoint for a power test, or drain every task for an exhaustive zero.
3. Before any live run, recover blind planted mnemonics over all 1,945 roots with no word, cycle or shift supplied.
4. Report a zero only on natural drain (`complete`, every task finished, no endpoint over cap). Otherwise the cell is scoped-inconclusive.
'''

[[blocks]]
kind = "pseudocode"
body = '''
```text
// s words carry ENT = 32s/3 entropy bits and CS = s/3 checksum bits; the list
// holds 2,048 words.
function ENCODE(entropy[0..ENT-1], list):
    checksum = the first CS bits of SHA256(entropy)
    bits = entropy || checksum                                    // 11s bits
    for w in 0..s-1:
        word[w] = list[integer value of bits[11w .. 11w+10]]
    return word

function VERIFY(word[0..s-1], list):
    bits = concatenation of the 11-bit indices pos_list(word[w])
    entropy = bits[0 .. ENT-1]; checksum = bits[ENT .. ENT+CS-1]
    return checksum == the first CS bits of SHA256(entropy)

function PREFIX_ZONE(word[0..s-1], short_word_rule):
    // Four letters identify every word of length >= 4. Three-letter words
    // require the separately declared fixed-width rule.
    return each word serialized to four characters under short_word_rule

// Cipher layer: one unknown 26-cycle z and shifts k by absolute position
// (Vigenère form shown; Beaufort replaces z(c) - z(p) by z(c) + z(p)).
function ENCRYPT_LAYER(p[0..n-1], z, k[0..m-1]):
    for i in 0..n-1:
        // z(c) - z(p) - k[i mod m] = 0
        c[i] = z_inverse((z(p[i]) + k[i mod m]) mod 26)
    return c

// Exact search: assign the first s - 1 words most-constrained-first, keeping
// every residue map consistent and injective at each node; the checksum then
// fixes the last word, so it prunes.
```
'''

[[blocks]]
kind = "complexity"
body = '''
Period-7 tie, 24 prefixes: 73,528 tasks and 793,712,197 nodes in 1,594 s (Vigenère), 33,540 tasks and 47,310,816 nodes in 79 s (Beaufort). Period 4: 743,973 tasks and $6.68 \times 10^9$ nodes in 4,333 s (Vigenère), 619,859 tasks in 213 s (Beaufort). Full spellings under known alphabets: 25,022,464 word assignments per cell, eight cells. Power runs found their plants after 27,361 of 63,629 tasks (95 s) and 110 of 78,002 tasks (9 s).
'''

[[blocks]]
kind = "failure_modes"
body = '''
- **Power tests are not uniqueness tests.** A control that stops at its first verified endpoint proves recovery power, not that no other endpoint exists.
- **Incomplete drains.** One 12 + 24 wildcard cell stopped at 73.3% of its tasks after an hour and is recorded as inconclusive, never as an exclusion.
- **Model boundaries.** Mnemonics containing any three-letter word, a different origin, another word count, or an unknown alphabet under seven free shifts are outside the closed cells. The unknown-cycle full-spelling model is the principal remaining version.
- **Dictionary-distance optimisers** (annealing toward valid words) are decoder-power tools only and never authorised a live claim.
'''

[[blocks]]
kind = "controls"
body = '''
Period-7 tie (log 445): blind full-root Vigenère and Beaufort plants recovered with checksum and scalar forward; live: both relations drained with zero endpoints. Period 4 (log 447): blind plants recovered for both relations; live: zero solutions, zero over-cap. Period 2 (logs 450/452): four blind 12-word controls and 2/2 controls at 15, 18 and 21 words; eight live cells complete with zero solutions. Key-word-tied (logs 454/455): Vigenère and Beaufort truths recovered blind in 200.8 s and 346.6 s, cycles equal to the plants up to a unit. Full spellings under the four known alphabet pairs (log 472): 8/8 planted controls, eight live cells exact with zero candidates. Wildcard 12 + 24 (log 465): Beaufort exact negative, Vigenère inconclusive.
'''

[[blocks]]
kind = "example"
title = "Worked example"
body = '''
The all-zero entropy vectors show the checksum rule. With 128 zero bits, $\operatorname{SHA256}(16 \text{ zero bytes})$ begins `37...`, so the 4 checksum bits are `0011` $=3$, and the 12-word mnemonic is `abandon` eleven times followed by word 3, `about`. With 256 zero bits, $\operatorname{SHA256}(32 \text{ zero bytes})$ begins `66...`, so the 8 checksum bits give index 102, and the 24-word mnemonic is `abandon` twenty-three times followed by `art`. The first 23 fixed-width fields can be `ABAN`; `art` supplies only `ART`, so a fourth character requires an explicit padding rule and lies outside the unpadded four-letter-prefix cell.
'''

[[blocks]]
kind = "notes"
body = '''
The hypothesis was chosen because it is a concrete, checksum-constrained realisation of a high-entropy but structured key. The exact negatives remove its simplest geometries and the audits are explicit that they do not justify a blind sweep of further periods without an independent reason.
'''

