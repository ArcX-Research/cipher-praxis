summary = "Slide ciphers encrypt two letters at a time with a two-row rectangle. The top row is the straight alphabet. A repeating key shifts the bottom row. The plaintext pair marks two corners, and the ciphertext uses the other two, as in Playfair. Portax uses Porta's half-alphabet rectangle instead. Both ciphers need a period search followed by the rectangle rule."
updated = "2026-10-06"

[[blocks]]
kind = "definition"
body = '''
**Slidefair.** Split the text into digraphs $(a, b)$ and let the key position be $i \bmod P$ with shift $k$. The bottom-row coordinate is

$$\operatorname{bottom}_k(j) = j + k \ (\text{Vigenère}), \qquad j - k \ (\text{Variant}), \qquad k - j \ (\text{Beaufort}) \pmod{26}.$$

With $a$ at column $j_a=a$ of the top row and $b$ at column $j_b=\operatorname{bottom}_k^{-1}(b)$ of the bottom row, unequal columns encrypt as $\big(\text{top}[j_b],\text{bottom}[j_a]\big)$. In the audited same-column convention, encryption moves both outputs one column right and decryption moves them one column left. **Portax** lays each block of $2P$ letters in two rows of width $P$ and uses the Porta rectangle for each vertical pair with $s=\lfloor\operatorname{pos}(k)/2\rfloor$; its same-column case exchanges rows, so Portax encryption and decryption coincide.
'''

[[blocks]]
kind = "equations"
title = "Explicit Slidefair map and observable key"
body = '''
For the Vigenère rule, $j_b = b - k$ and the digraph maps to

$$(a, b) \mapsto \big((b - k) \bmod 26,\ (a + k) \bmod 26\big),$$

For unequal columns this rectangle exchange is an involution: applying it again returns $(a,b)$. The displayed algebra does not describe the same-column exception. Under the audited convention that exception uses $j_a+1$ on encryption and $j_a-1$ on decryption, so full Slidefair requires a directional inverse. Under Portax the observable key is the pair class A/B, C/D, ... of each key letter, canonicalised to the even representative, exactly as for Porta.
'''

[[blocks]]
kind = "variants"
body = '''
- **Slidefair** with the three bottom-row rules.
- **Portax** with a period-$P$ key word.
- Related: [Porta](/ciphers/porta) (monographic), [Playfair](/ciphers/playfair) (square instead of slide).
'''

[[blocks]]
kind = "assumptions"
title = "Assumptions and invariants"
body = '''
- Digraph boundaries, odd-length padding and key advancement are explicit. The recorded search tested periods 1 to 12; that is a search scope, not a restriction in the cipher definition.
- The unequal-column Slidefair rectangle rule is an involution; its same-column rule is directional. A fitted key still round-trips under the matching inverse, and that round-trip is an implementation check rather than evidence for the model.
- For unequal columns the outputs exchange the two rectangle coordinates. The same-column exception tests both input coordinates, so the complete map cannot be treated as two independent one-letter substitutions.
'''

[[blocks]]
kind = "attack"
title = "How to attack it"
body = '''
1. Enumerate the period $P = 1 \dots 12$ exhaustively; for each, search the key with the external annealer under a quadgram objective.
2. Re-implement the rectangle rules independently and verify every recovered result by forward encryption.
3. Gate on the control recovering all letters, the hidden period and the observable key class before the live text is admitted; require the language gate before any null.
'''

[[blocks]]
kind = "attack"
title = "Cache complete digraph maps"
body = '''
For each key value and row rule, cache the bottom row and its inverse-position map. Precompute forward and inverse digraph tables, including the vertical exception. A transform then needs one lookup per digraph, and period search can reuse the same tables across trials. At alphabet size $q$, all $q$ shifts take $O(q^3)$ table entries; keeping only the bottom rows and their inverses uses $O(q^2)$ entries with constant-time arithmetic per pair. Use the latter when the full tables do not justify their memory cost.
'''

[[blocks]]
kind = "pseudocode"
body = '''
```text
function PREPARE_SLIDEFAIR(key,rule):
    for each distinct key value k:
        bottom[k] = the q-entry row defined by rule and k
        for column = 0..q-1: inverse[k,bottom[k,column]] = column
        for a,b in 0..q-1:
            other = inverse[k,b]
            for direction in {+1,-1}:
                if a == other:
                    j = (a+direction) mod q
                    table[k,direction,a,b] = (j,bottom[k,j])
                else: table[k,direction,a,b] = (other,bottom[k,a])
    return table
function SLIDEFAIR(text,key,table,decrypt):
    require nonempty key and an even text length under the padding convention
    direction = -1 if decrypt else +1
    for pair = 0..length(text)/2-1:
        k = key[pair mod length(key)]
        out[2*pair],out[2*pair+1] = table[k,direction,text[2*pair],text[2*pair+1]]
    return out
function PORTAX(text,key):
    for each complete block of 2*length(key) letters:
        split the block into equal rows R0,R1
        for column = 0..length(key)-1:
            R0[column],R1[column] = PORTA_RECTANGLE(
                R0[column],R1[column],floor(key[column]/2))
    return the rows written back in place  // define partial-block handling separately
```
'''

[[blocks]]
kind = "complexity"
body = '''
$26^P$ keys per rule and period (13 classes per position for Portax); with $P \le 12$ the annealer converged on every 504-letter control within the audit's standard budget in both declared seeds.
'''

[[blocks]]
kind = "failure_modes"
body = '''
- **Period selection on a wrong family.** The recorded searches selected periods 8, 12, 12 and 11 with rates $-7.58$, $-7.49$, $-7.48$ and $-7.42$: these low-scoring outputs were search misses, not exhaustive family exclusions.
- **Vertical-case conventions.** A source that shifts the vertical case differently produces a different cipher. The program's independent implementation had to match the generator byte for byte.
'''

[[blocks]]
kind = "controls"
body = '''
Log 200: Portax with a nine-letter key (period 9) recovered at rate $-4.18$; Slidefair Vigenère, Variant and Beaufort with seven-letter keys recovered at $-4.46$, $-4.05$ and $-4.01$. All four gates passed in both production seeds, with periods and observable key classes recovered and the complete ciphertext reproduced by the independent transform (logs/200_digraphic_slides.log). Live text: all four rules non-English as above. No null spent.
'''

[[blocks]]
kind = "example"
title = "Worked example"
body = '''
Slidefair, Vigenère rule, key shift $k = 3$, digraph `HI` ($a = 7$, $b = 8$):

```trace
top row     A B C D E F G H I ...   (j)
bottom row  D E F G H I J K L ...   (j + 3)
```

`H` is column 7 of the top row; `I` is in the bottom row at column $8-3=5$. Exchanging columns gives top[5] $=$ `F` and bottom[7] $=7+3=10=$ `K`: ciphertext `FK`. This pair is not vertical, so its inverse happens to use the same rectangle exchange and returns `HI`; vertical pairs instead use the left-shift decryption case.
'''

[[blocks]]
kind = "notes"
body = '''
The recorded search supplies control and implementation evidence under its stated budget. Neither completing a period loop nor obtaining a low best score makes a heuristic key search exhaustive. The transform checks and the search outcome have separate scopes.
'''

