title = "Digraphic slide ciphers (Slidefair and Portax)"
subtitle = "Encrypt letter pairs with rectangles between a fixed row and a shifted row"
status = "VERIFIED"
status_note = "The rectangle maps and directional Slidefair inverse are checked exhaustively on letter pairs. Recorded period-search controls also recovered their planted texts, but a heuristic search miss does not exclude the cipher family."
family = "Polygraphic substitution"
tags = ["digraphic", "slide", "periodic", "reciprocal"]
