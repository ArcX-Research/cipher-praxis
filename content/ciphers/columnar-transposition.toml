title = "Columnar transposition"
subtitle = "Write in rows, then read the columns in a key-controlled order"
status = "VERIFIED"
status_note = "Several checks support column recovery. A full search of 9! orders passed 23/24 development controls. An order-free width test solved 4/4 planted layered ciphers from a cold start. Two 504-letter width-9 controls over a periodic layer were recovered exactly. The general cascade also re-solved transpositions in earlier solved texts."
family = "Transposition"
tags = ["transposition", "columnar", "keyword order", "width"]
related = ["route-transposition", "myszkowski", "rail-fence", "sandwich-construction", "transposition-width-recovery", "order-free-width-statistic", "mixture-inference-under-transposition", "exact-dynamic-programming", "transposed-running-key-endpoint-scoring", "all-different-constraints", "columnar-lab", "g-transposition-grid", "joint-transposition-periodic-search", "amsco", "swagman"]
summary = "A columnar transposition writes the message in rows of a chosen width, then reads columns in an order set by a keyword. The letters do not change, so their total frequencies stay the same. The task is to recover the width and column order. Tests checked every order at width 9, used annealing at larger widths, and used an order-free statistic to find the width when the transposition sat between two substitutions."
updated = "2026-09-08"

[[blocks]]
kind = "definition"
body = '''
For width $w$ and a permutation $O$ of the columns, write $p$ row by row into a $\lceil n/w \rceil \times w$ grid (the last row possibly short) and output the columns in the order $O$:

$$T_O(p) = p[O_0 :: w] \,\|\, p[O_1 :: w] \,\|\, \dots \,\|\, p[O_{w-1} :: w].$$

A key word gives $O$ by the alphabetical ranks of its letters. With $n$ not a multiple of $w$ the first $n \bmod w$ columns are one letter longer (irregular columnar). A padded version fills the last row.
'''

[[blocks]]
kind = "equations"
title = "Interaction with a periodic layer"
body = '''
If a period-$m$ additive layer is applied **before** the transposition, output position $j$ in read-out chunk $q$ and row $r$ came from source position $wr+c$, where $c=O_q$, and therefore carries key residue $(wr+c)\bmod m$. For $w=9$ and $m=7$ this is $(2r+c)\bmod7$, so a column order is characterised by a phase assignment with multiset $\{0,0,1,1,2,3,4,5,6\}$: exactly $9!/(2!\,2!)=90{,}720$ phase classes, with columns 0/7 and 1/8 interchangeable at the profile level. If the periodic layer is applied after the transposition, its residue is instead simply $j\bmod m$ in ciphertext order. The program's cross-derived lanes score all 90,720 inner-layer phase patterns exactly under a monogram model and then complete an order by subset DP over quadgram factors that straddle row ends.
'''

[[blocks]]
kind = "variants"
body = '''
- **Single columnar**, regular or irregular, width 3 to about 30.
- **Double columnar**: two keyed columnars in sequence (the corpus's solved texts contain one such pair).
- **Myszkowski**: key words with repeated letters; see [Myszkowski transposition](/ciphers/myszkowski).
- **Columnar inside a sandwich**: between two substitution layers; see [Sandwich construction](/ciphers/sandwich-construction).
- **Column-read of a periodic cipher** and its inverse row-read: the two 504-letter width-9 models of the corpus.
- **Column-read running key**: a candidate text is read by columns and used as a second stream. A complete endpoint can be routed exactly by subset DP, while partial known letters give an assignment proxy; see [Transposed running-key endpoint scoring](/exact/transposed-running-key-endpoint-scoring).
'''

[[blocks]]
kind = "assumptions"
title = "Assumptions and invariants"
body = '''
- Letter identities are preserved: the ciphertext has the plaintext's histogram and index of coincidence.
- Invariant: the multiset of letters in each column is fixed once the width is fixed. Only their order is unknown.
- Layer order matters. With a periodic layer before the transposition, its phase travels with each source position and a proposed column order determines the $(wr+c)\bmod m$ pattern above; arbitrary transposition does not preserve each output coset's multiset. With the periodic layer after the transposition, ciphertext cosets are fixed directly by $j\bmod m$.
'''

[[blocks]]
kind = "attack"
title = "How to attack it"
body = '''
1. **Width.** Scan widths; for plain columnar, score adjacency of candidate column pairs by digram likelihood; under an outer periodic layer use the order-free width statistic (a DP over the long and short columns of the unpadded grid that measures the block pattern of coset classes without knowing the order).
2. **Order.** Exhaustive for $w \le 9$ (or 10), dictionary words for 10 to 20 letters, restarted annealing with a full-neighbourhood finish beyond; or the exact 90,720-phase profile plus subset DP when a period-7 layer sits inside the columnar transposition.
3. **Joint refit.** A near-exact substitution peel and a nearly right column order polish each other; neither alone reads English, so re-solve the transposition inside every polish round.
'''

[[blocks]]
kind = "pseudocode"
body = '''
```text
// Width w and column order O, a permutation of 0..w-1. p[col :: w] is every
// w-th letter of p from col.
function KEY_TO_ORDER(keyword):
    // rank the key letters alphabetically; O lists the columns in order of
    // rank
    return the column indices sorted by the rank of the key letter above each
            column

function ENCRYPT(p[0..n-1], w, O):
    c = empty
    for q in 0..w-1:
        c = c || p[O[q] :: w]                   // column O[q], top to bottom
    return c

function DECRYPT(c[0..n-1], w, O):
    // the first `long` columns hold one extra letter
    rows = ceil(n / w); long = n mod w
    pos = 0
    for q in 0..w-1:
        col = O[q]
        len = rows if (long == 0 or col < long) else rows - 1
        for r in 0..len-1:
            p[r * w + col] = c[pos]; pos = pos + 1
    return p
```
'''

[[blocks]]
kind = "complexity"
body = '''
$w!$ orders: $9! = 362{,}880$, exhausted per configuration cell in compiled code (a 1,024-cell benchmark took 4.1 seconds; 185,088 cells took 963 seconds). Phase classes: 90,720 with exact 26-way key profiling per coordinate. The subset DP over the inner order uses $2^9$ masks times last-three-label states per row and is exact conditional on its supplied phase/key candidates; the complete pipeline is not exhaustive when an earlier shortlist discards a candidate.
'''

[[blocks]]
kind = "failure_modes"
body = '''
- **Handoff under-power.** One development control (D8 of 24) was lost only because a single monogram-argmax key for its true phase initialised the exact inner DP in the wrong basin; with the true key supplied post hoc the DP returned the exact order at once. The remedy is a top-16 key completion per phase, not a bigger search.
- **Family-level ties.** When a base cell can be described two ways (simultaneous source reversal), the exact global best has tie multiplicity 2 and a strict unique-rank gate fails even though the recovered order is right.
- **Width scan misranks.** In the recipe-free cascade the true width of one solved text ranked 4th at $-6.37$ before the joint refit took it to $-4.23$.
- **Selection.** Undoing every column order of widths 6-9 (409,000 orders) on a 504-letter text never restored a period-7 structure. The maximum coincidence rate of 0.045 versus 0.066 expected is the noise maximum, not evidence.
'''

[[blocks]]
kind = "controls"
body = '''
Order-free width statistic (logs/05_mix.log): four planted sandwiches (width 9 exact grid, width 8 ragged, width 12 with nine long columns and mixed alphabets, width 9 with a period-3 inner) all solved 100% from cold with the true width on top at z from +4.3 to +12.8. Width-9 columnar over a period-7 layer at 504 letters (log 192): the column-read control recovered its order, key and both layers exactly. The inverse row-read control likewise. The live text scored $-7.33$, not English. Cross-derived sandwich (log 237): 23/24 development controls recovered the exact outer order, inner order, key and plaintext at rank 1, all 24 truth phases ranked 1 of 90,720. Untranspose-one-source lane (log 236): 24/24 exact recoveries conditioned on the base cell.
'''

[[blocks]]
kind = "example"
title = "Worked example"
body = '''
Key `ZEBRAS` (alphabetical ranks: A=1, B=2, E=3, R=4, S=5, Z=6, so the read order is columns 4, 2, 1, 3, 5, 0), plaintext `WEAREDISCOVEREDFLEEATONCE` (25 letters, irregular):

```
W E A R E D
I S C O V E
R E D F L E
E A T O N C
E
```

Columns in read order: `EVLN`, `ACDT`, `ESEA`, `ROFO`, `DEEC`, `WIREE`. Ciphertext `EVLNACDTESEAROFODEECWIREE`. The [columnar lab](/labs/columnar-lab) animates the read-out.
'''

[[blocks]]
kind = "notes"
body = '''
The corpus's solved texts include a width-7 columnar, a width-8 columnar under two periodic keys, a double width-9 columnar and a columnar over a running key, all recovered by the same width-scan and joint-refit machinery. The unsolved texts show no width at which any order restores a periodic structure, and the sandwich reading was excluded for them by the transposition-invariant mixture argument.
'''

