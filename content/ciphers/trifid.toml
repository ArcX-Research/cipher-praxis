title = "Trifid cipher"
subtitle = "Split letters into three coordinates on a 27-cell cube"
status = "CLOSED"
status_note = "Direct 504-letter Trifid tests covered periods 2–40 and solved 2/2 arbitrary-cube controls exactly. Shared-cube tests across 153- and 144-letter texts passed 3/3 fixed-period and 3/3 period-selection controls. Those forms were ruled out for the project texts. Trifid beneath another periodic layer failed all four controls and is power-limited."
family = "Fractionation"
