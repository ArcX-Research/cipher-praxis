title = "Symmetric second-order plaintext feedback"
subtitle = "A running alphabet state driven by the current and previous latent plaintext coordinates"
status = "VERIFIED"
status_note = "The modular recurrence, inverse, gauges, and family boundaries pass independent target-absent checks. After an initial selector exposed a rare-label error, a frozen fresh panel recovered all six planted structural cells and exact plaintexts while rejecting all thirty negatives."
family = "Stream and machine ciphers"
tags = ["plaintext feedback", "second order", "state recurrence", "mixed alphabet"]
