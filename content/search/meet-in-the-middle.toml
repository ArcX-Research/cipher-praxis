id = "meet-in-the-middle"
section = "search"
title = "Meet in the middle"
subtitle = "Search two halves separately, then join pairs that agree on a shared value"
status = "POWER-LIMITED"
status_note = "The standard two-table method is shown in a worked example. The implemented decoder grows text from both ends with forward and reverse character models, then checks whether their partial maps agree. All four hidden controls at 63 and 95 letters failed. The true state reached pair rank 17,019,599 while the pool held 80,000, so this decoder gives no target information at those lengths."
family = "Enumeration strategies"
tags = ["bidirectional", "time-memory trade-off", "join", "beam", "reverse language model"]
related = ["beam-search", "exhaustive-enumeration", "k-best-lists", "cp-sat-and-smt-solvers", "all-different-enumeration", "quagmire-iii", "shared-cycle-attack", "local-language-model-prior", "planted-controls", "g-beam-width"]
summary = "Meet-in-the-middle search computes forward and backward intermediate values and joins equal values. For two key spaces of size N, it can reduce the main transform evaluations from order N squared to order N, at the cost of order N memory and any work needed to process collisions and verify candidates. The recorded bidirectional decoding variant remains a capped beam heuristic; on its cited short controls, the true pair fell below the retained pool before exact constraints became selective."
updated = "2026-10-06"

[[blocks]]
kind = "definition"
body = '''
Classical form for a composition $c = F_{k_2}(G_{k_1}(p))$ with a known pair $(p, c)$:

```
T1 <- { G_{k_1}(p) -> k_1  for every k_1 }          # forward table
for every k_2:
    v <- F_{k_2}^{-1}(c)                          # backward value
    for each k_1 in T1[v]: report (k_1, k_2)         # candidates, confirmed on a second known pair
```

Work is $|K_1| + |K_2|$ evaluations plus a table of size $|K_1|$, against $|K_1| \cdot |K_2|$ for direct search.

Decoding form (bidirectional meet beam): keep $W$ parent states, each holding a prefix, a suffix and one shared partial key map. For every retained parent, enumerate the full $26 \times 26$ next-letter product, install both letters into the shared partial map, apply necessary rotation or reflection identities, and retain a ranked pool of size $M$. At declared checkpoints, an exact AllDifferent solver may remove states proved infeasible. The local expansion and feasibility decisions are exact, but the $W$ and $M$ cuts make the decoder heuristic.
'''

[[blocks]]
kind = "equations"
body = '''
Join condition: $G_{k_1}(p) = F_{k_2}^{-1}(c)$. If the meeting values behave as independent uniform $b$-bit strings, the expected number of accidental pairs is $|K_1||K_2|/2^b$. Real cipher intermediates can be nonuniform and correlated, so candidate counts must be measured or verified; additional known pairs reduce collisions.

Decoding budget per macro-step: raw pair scores $\le 676\,W$; with $W = 40{,}000$ that is $27{,}040{,}000$ candidates ranked to a pool of $M = 80{,}000$. The exact system tested at the meet is the shared-cycle system $a(C_i) \mp a(P_i) - k_{i \bmod 7} \equiv 0 \pmod{26}$ with all 26 positions distinct and $a(A) = 0$ as gauge.
'''

[[blocks]]
kind = "variants"
title = "Four-layer joins with crib-relative phases"
body = '''
For a positionwise cascade $P=G_4(G_3(G_2(G_1(C))))$, join the intermediate windows

$$G_2(G_1(C_{window}))=G_3^{-1}(G_4^{-1}(P_{crib})).$$

Canonicalize each layer by its actual permutation tables rather than its label, retaining the parameter aliases. Split the work into the two layer pairs and compute the crib-side table once when its phases are independent free variables. A phase measured relative to a crib at offset $o$ satisfies $\phi_{relative}=\phi_{absolute}+o\pmod p$; recover the absolute phase by subtracting the offset. Tied phases or position-moving layers need their own proof and cannot use this shortcut automatically.

For an alphabet of size 26, at most twelve symbols fit exactly into a 64-bit integer using five bits per symbol. Include the length in the join key, or use one fixed length per table. This is a collision-free encoding of those windows, unlike a truncated hash. Retain every colliding parameter tuple and verify all crib positions and the complete proposed transform. A finite dictionary or crib-bank join covers that bank, not every possible key or plaintext.
'''

[[blocks]]
kind = "assumptions"
title = "Assumptions and invariants"
body = '''
- Classical: the outer transform is invertible for each tested key, the same intermediate representation is computed from both directions, and all colliding keys are retained. If the composition collapses to a simpler single-key family, direct search may be preferable but the meet identity remains valid.
- Decoding needs a reverse model trained and calibrated on reversed text. Applying the forward model to reversed strings is not equivalent. Train both models on data that does not overlap the controls.
- Only `unsat` removes a state; `unknown`, timeouts and solver errors keep it.
'''

[[blocks]]
kind = "attack"
title = "How to attack it"
body = '''
The decoding form targets a period-7 keyed substitution with one unknown 26-cycle on a 63- or 95-letter zone. Forward GRU (frozen, generic-text) and reverse GRU (same 64/192 two-layer architecture, eight epochs on the same 1,350,000-letter training range read right to left, final 1.5222 nats per letter) score the two fronts. The exact Z3 all-different system is sampled on 48 maps by four workers at 20 ms per query, and a full ranked scan activates only if the pilot yields decisive `unsat` results. Hidden plaintext is used only to report the truth's post-selection rank.
'''

[[blocks]]
kind = "pseudocode"
body = '''
```text
// Classical form with one join pair and one independent confirmation pair.
function MEET_IN_THE_MIDDLE(p, c, p2, c2):
    T1 = empty table
    for every k_1 in K_1:
        APPEND(T1[G_{k_1}(p)], k_1)
    candidates = []
    for every k_2 in K_2:
        v = F_{k_2}^{-1}(c)
        for each k_1 in T1[v]:
            if F_{k_2}(G_{k_1}(p2)) == c2: APPEND(candidates, (k_1, k_2))
    return candidates

function BIDIRECTIONAL_MEET(C, W, M):
    parents = {(prefix = "", suffix = "", map = {})}
    repeat until the two fronts meet or no state is left:
        pool = []
        for each parent in parents:
            for each next-letter pair (x, y):
                map' = INSTALL_AND_PROPAGATE(parent.map, x, y)
                if map' is consistent:
                    APPEND(pool, EXTEND_AND_SCORE(parent, x, y, map'))
        pool = TOP_WITH_TIES(pool, M)
        if checkpoint:
            status = EXACT_ALL_DIFFERENT_STATUS for each tested state
            remove only states with status INFEASIBLE
        parents = TOP_WITH_TIES(pool, W)
    return parents ranked by score
```
'''

[[blocks]]
kind = "complexity"
body = '''
Classical: $O(|K_1|+|K_2|+J)$ time after transform evaluation and expected $O(|K_1|)$ hash-table memory, where $J$ is the number of joined candidates inspected; worst-case collisions can make $J=|K_1||K_2|$. Decoding: $676\,W$ pair scores per macro-step, with the cited $W$, $M$, and model chunks recorded in provenance. No $W\times W$ join is materialized.
'''

[[blocks]]
kind = "failure_modes"
body = '''
- **Truth ranked below the pool.** Controls: at 63 letters the truth was rank 23,725 with four letters assigned and raw rank 17,019,599 with six, outside $M = 80{,}000$ (both relations); at 95 letters the truth's group rank was 46,523 (Vigenère, outside $W$) and 36,145 then raw rank 1,445,865 at eight letters (Beaufort).
- **No safe early rejection.** Every losing-pool pilot returned zero `unsat` (48/0/0, 38/0/10, 8/0/40, 0/0/48 SAT/UNSAT/unknown), so exact compatibility could not rescue the truth; treating unknown as impossible would fabricate power.
- **Memory wall.** Retaining the 17 million states needed at the first useful closure means about 52 GB just for two 2x192 GRU hidden states per state, before maps, sequences and solver work.
- **Classical caveat.** A commuting pair of layers (two additive keys of the same period) collapses to one key and the meet is vacuous.
'''

[[blocks]]
kind = "controls"
body = '''
Independently planted random cycles and non-zero distinct shifts over held-out English windows matched to the 63- and 95-letter equality profiles, both relations. A pass requires 100% plaintext, the hidden cycle/key affine class and an independent forward roundtrip. Result: 4/4 controls failed at the stages listed above. The endpoint gates were never reached and no target was run. Reproducibility: forward and reverse model caches and the corpus are hash-pinned in the audit.
'''

[[blocks]]
kind = "example"
title = "Worked example"
body = '''
Two non-commuting layers on $\mathbb{Z}_{26}$: first a shift $k_1$, then a multiplication by a unit $u_2$: $c = u_2 (p + k_1) \bmod 26$. Known pair $(p, c) = (3, 20)$.

Forward table: $T_1[k_1] = (3 + k_1) \bmod 26$ for all 26 values of $k_1$. Backward: for each of the 12 units, $v = u_2^{-1} \cdot 20 \bmod 26$. For $u_2 = 3$ the inverse is $9$ ($3 \cdot 9 = 27 \equiv 1$), so $v = 9 \cdot 20 = 180 \equiv 24$, which matches $T_1$ at $k_1 = 21$. Check: $3 \cdot (3 + 21) = 72 \equiv 20$. Each unit yields exactly one $k_1$, so 12 candidate pairs remain after $26 + 12 = 38$ evaluations instead of $312$. A second known letter, say $(p', c') = (5, 0)$, is satisfied by $(k_1, u_2) = (21, 3)$ since $3 \cdot 26 \equiv 0$, and eliminates most others.
'''

