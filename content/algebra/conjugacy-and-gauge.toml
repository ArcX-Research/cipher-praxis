id = "conjugacy-and-gauge"
section = "algebra"
title = "Conjugacy and gauge freedom"
subtitle = "When different-looking settings produce the same cipher, and how to compare them fairly"
status = "VERIFIED"
status_note = "The shared-cycle symmetries are proved and tested: 48/48 unit checks, 16/16 translation checks, and 312 equivalent descriptions reduced to one class. One control run recovered in one gauge but scored in another. That run was marked invalid and replaced."
family = "Group theory"
tags = ["gauge", "symmetry", "canonicalisation", "identifiability", "conjugacy"]
related = ["permutation-cycles", "group-actions-on-alphabets", "units-mod-26", "affine-maps-mod-26", "modular-arithmetic-z26", "gauge-defect-invalidation", "planted-controls", "shared-cycle-attack", "segment-chain-analysis", "key-cancellation", "quagmire-iii", "latent-label-identifiability", "candidate-bank-lineage-and-cap-accounting", "partial-permutation-completion-bounds", "g-gauge-freedom", "g-affine-orbit", "g-conjugate-permutation", "independent-coordinate-alphabets", "factorial-completion-resource-guards", "lcm-of-periods", "finite-extension-fields", "symbolic-codebook-propagation"]
summary = "Gauge freedom means that different parameter values can produce exactly the same visible result. For keyed additive ciphers, you may shift the alphabet coordinates along with the key or multiply them by a unit. A solver must treat these versions as equivalent. If it fixes the gauge incorrectly, or recovers in one gauge and scores in another, it can reject a correct answer. One recorded run failed for this reason."
updated = "2026-10-06"

[[blocks]]
kind = "definition"
body = '''
Two permutations are **conjugate** when $w = z^{-1} \tau z$ for some bijection $z$: the keyed additive alphabet is the conjugate of a plain rotation by the coordinate map. A **gauge freedom** of a model with unknowns $\theta$ is a group $G$ acting on $\theta$ such that every observable (ciphertext, and any statistic computed from it) is invariant: $\mathrm{obs}(g\theta) = \mathrm{obs}(\theta)$. Solutions therefore come in $G$-orbits; **gauge fixing** picks one representative per orbit by adding constraints, and **canonicalisation** picks a distinguished member (for example the lexicographic minimum) after enumeration.
'''

[[blocks]]
kind = "equations"
title = "The two-text chain and its gauges"
body = '''
Let text A be enciphered with the length-$N_B$ plaintext of text B as a cycled running key, both under one unknown cycle $z$, signs $e_A, e_B \in \{\pm 1\}$, and a segmented key $\kappa_j$ on text B:
$$z(C^B_j) \equiv e_B\, z(P^B_j) + \kappa_j, \qquad z(C^A_i) \equiv e_A\, z(P^A_i) + z(P^B_{j}), \quad j = i \bmod N_B.$$
Eliminating $P^B$:
$$z(P^A_i) - e_A\, z(C^A_i) + e_A e_B\, z(C^B_j) - e_A e_B\, \kappa_j \equiv 0 \pmod{26}.$$
Gauges of this system:
- **(G1) translation** $z \to z + b$, together with $z(P^{B\prime}) = z(P^B) - e_A b$ and $\kappa \to \kappa + b\,(1 + e_A e_B - e_B)$: both ciphertexts and $P^A$ unchanged, 26-fold.
- **(G2) unit multiplication** $(z, \kappa) \to (u z, u \kappa)$: literally identical ciphertexts, 12-fold.
- **(G3) unobserved letters** can be permuted among unused coordinates when they occur in none of the model's constraints. The completed dial must still be bijective.

One valid translation fix is $z(X_0)=0$ for a single letter $X_0$, leaving $\kappa$ free to absorb the shift. In this displayed model, fixing one key intercept to zero is an alternative: the translation coefficient $1+e_Ae_B-e_B$ is always a unit modulo 26. Imposing both fixes generally removes valid solutions. A unit gauge cannot generally be fixed by requiring a particular $z(X_1)=1$, because its true difference from the zero anchor may be a nonunit. After enumeration, canonicalise with $\min_u u\,(z-z(A))$, one representative per complete-dial orbit $\{uz+b\}$ of size $312$.

In a same-alphabet chain cell the additive gauge $(c + d, k + d)$ on the segmented key is a symmetry; in mixed-order cells it is not.
'''

[[blocks]]
kind = "variants"
title = "A free substitution absorbs a preceding relabeling"
body = '''
Suppose a latent stream is $r_i=\phi(P_j)$, where $\phi$ is a bijection, and a second text obeys

$$b(C_j)=\sigma a(P_j)+h_{g(j)}\pmod q,$$

with an unrestricted plaintext dial $a$ and $\sigma\in\{+1,-1\}$. Define

$$a_r(u)=\sigma a(\phi^{-1}(u)).$$

Then $b(C_j)=a_r(r_i)+h_{g(j)}$. Conversely every residual witness lifts to the original coordinates using $P_j=\phi^{-1}(r_i)$ and $a(x)=\sigma a_r(\phi(x))$. Both directions preserve injectivity, unused-letter completions, position reindexings and exact copies of positions.

Consequently a structural search can operate on $r$ once, independently of the chosen $\phi$. In particular, the $2q$ sign/offset labels $\phi(x)=s z(x)+k$ need not multiply that search. This removes redundant descriptions; it does not prove a speedup for a particular implementation or improve a heuristic's candidate coverage.

Restore the aliases before applying evidence that depends on physical plaintext letters. A language score must use one global $\phi$ for the whole text, not a separate best alias for each row or column. Fixed plaintext, non-invariant word domains and tied dials can break the reduction. A restricted dial family retains it only when that family is closed under the displayed composition. Keep parameter provenance even when several aliases decode to the same observed string.
'''

[[blocks]]
kind = "variants"
title = "Equivalent equations can have different readings"
body = '''
A transformation can preserve whether equations have a solution without preserving the text a later stage reads from that solution. Fix the observable before deciding which descriptions to merge.

For a bijective dial $z$ modulo $m$, suppose three observed streams satisfy

$$z(W_i)=a z(X_i)+b z(Y_i)+h_{g(i)},\qquad a,b\in\{+1,-1\}.$$

One ordered reconstruction has coordinate stream $d_i=z(X_i)-a z(W_i)$. After restoring a translation phase $\delta$, its physical reading is $U_\delta[i]=z^{-1}(d_i-a\delta)$. A nonempty stream has exactly $m$ different readings as $\delta$ varies. For an affine dial $Z=uz+\tau$, the same reading uses $\delta=u^{-1}\tau$: retain every unit sidecar with $\tau=u\delta$, rather than treating all $m\varphi(m)$ affine descriptions as independent texts.

Swapping $X,Y$ and $a,b$ leaves the feasibility equation unchanged, but changes the reconstructed coordinate to $d'_i=z(Y_i)-b z(W_i)$. The two complete translation-reading sets coincide if and only if $d'_i-d_i$ is constant over all included positions. Otherwise those sets are disjoint, even though their equation rows are identical.

The feasibility calculation may be cached once, but every already-declared ordered role must survive in the metadata and be decoded separately. This does not justify adding new roles after inspecting a result. Only deduplicate physical text after its complete reading and parameter origins are recoverable; see [candidate-bank lineage](/engineering/candidate-bank-lineage-and-cap-accounting).
'''

[[blocks]]
kind = "variants"
title = "Solve observed coordinates without losing the missing letters"
body = '''
Suppose independent coordinate maps enter only same-class difference equations, so each map has its own translation freedom. Map $j$ observes a nonempty set $S_j$ of $k_j$ physical letters in an alphabet of size $m$. Let $r_j=m-k_j$ and $r=\sum_j r_j$. Compare the full field kernel, with one fixed physical letter gauged to zero, with the kernel containing only observed coordinates, gauged at one observed anchor per map. Then

$$d_p(\mathrm{full})=r+d_p(\mathrm{observed}).$$

Restriction to observed coordinate differences is onto. Its kernel consists of functions constant on each observed set and arbitrary on unused letters; it has exactly $r_j$ dimensions per map. This remains true when the fixed physical letter is unobserved. The identity counts avoidable linear freedom; it is not a measured speedup or a bound on the remaining search.

For unrestricted permutation maps, an observed assignment extends if and only if its actual modular images are distinct. Each map's unused physical letters may then be matched bijectively with its unused images, giving exactly $F=\prod_j r_j!$ full completions. Modulo26, marginal limits of13 symbols per parity and two per residue modulo13 are necessary but not sufficient: equal odd residues must also have opposite parity. Do not impose a full-alphabet checksum or a balanced histogram on an observed subset. Its image complement supplies the missing values automatically.

Keep the completion family, not just its size. If an inverse lookup asks for $t$ distinct coordinates outside one map's observed image, there are $r_j!/(r_j-t)!$ possible physical answers. Repeated queries must repeat the same letter, and distinct queries must use distinct letters. Each answer retains $(r_j-t)!$ completions of that map, multiplied by the other maps' completion counts.

Unit symmetry can have a stabilizer on a partial map even though it acts freely on full permutations. Modulo26, every unit fixes the anchored image $\{0,13\}$. Therefore a partial completion family must not automatically be divided by12. Count its stabilizer, or retain all witnesses without this quotient. Similarly, complete an unobserved physical-zero image before changing gauges; there is no extra factor of26 to discard.

These factorial counts require unrestricted missing coordinates and independent maps. Involutions, coupled maps, fixed key families or prescribed images need additional constraints; [partial-permutation completion bounds](/exact/partial-permutation-completion-bounds) treats the different involution case. Symbolic completion preserves feasibility but does not by itself choose readable missing letters. These statements have independent proof review, not a new implementation or recovery benchmark.
'''

[[blocks]]
kind = "variants"
title = "Coordinate-convention quotients"
body = '''
For three ternary coordinate axes, permuting the axes and independently permuting each axis's digit names gives $3!\,(3!)^3=1296$ descriptions. If an unrestricted independent plaintext codebook can absorb one common digit relabeling throughout the model, that six-element action removes duplicate descriptions: $1296/6=216$ convention classes.

Generate representatives directly. For each axis order, compose every digit map with the inverse of the first map so the first becomes the identity; enumerate only the two remaining digit permutations. Keep the absorbed relabeling as provenance for lifting witnesses. This normalization is valid only when the entire constrained model permits the common relabeling. A fixed plaintext codebook, fixed coordinate names or additional non-invariant restrictions can break it.

The quotient removes redundant parameter conventions, not failed controls or unfinished branches. The independent finite check enumerates all descriptions and compares their canonical classes.
'''

[[blocks]]
kind = "assumptions"
body = '''
- A gauge is a symmetry of the *whole* observable model, including the comparison used in controls. If a score is not gauge-invariant (English quadgrams of a decrypt whose cycle coordinates are rotated are not), the score must be maximised over the gauge, or the comparison must be made modulo the orbit.
- The gauge group depends on the model: with a shift-free key stream taken from another text's letters, translation is no longer a symmetry and only the 12 units remain.
- Route models have their own gauge: when every admitted period divides the text length, the cyclic cut of an affine route is unidentifiable.
'''

[[blocks]]
kind = "assumptions"
title = "Observed-coordinate completion procedure — scope"
body = '''
Observed-coordinate enumeration can defer unused labels only when they occur in no remaining constraint or queried output. Count completions within the stated gauge convention; fixing the zero label on an unobserved symbol consumes that coordinate even though no observed variable receives it. Finite synthetic comparisons check this boundary case separately from recovery experiments.
'''

[[blocks]]
kind = "attack"
body = '''
- A complete dial has $26!/(26\cdot12)$ affine classes. If seven residue shifts are independently free after fixing that gauge, the parameter count is $26!\,26^7/(26\cdot12)$. Counting parameters does not prove identifiability: uniqueness depends on the observed constraints and on the allowed plaintexts.
- Deduplicate candidate banks by orbit for an invariant structural calculation. Before scoring physical plaintext, restore every alias on which the score depends; in the displayed chain this includes all 26 translation readings of text B.
- In controls, compare the recovered cycle on observed letters modulo the orbit, compare the second text modulo its induced coordinate rotation, and report the recovered shift; require exact recovery of the first text and both scalar forwards.
'''

[[blocks]]
kind = "pseudocode"
body = '''
```text
// Gauge actions on a shared-cycle chain solution (z, P^B, kappa); both leave
// the ciphertexts and P^A unchanged. Coordinates are mod 26 throughout.
function TRANSLATE(z, zPB, kappa, b, e_A, e_B):    // (G1): z -> z + b
    for each letter x: z'[x] = z[x] + b
    // z(P^B') = z(P^B) - e_A b, old coordinates
    for each j: zPB'[j] = zPB[j] - e_A*b
    for each j: kappa'[j] = kappa[j] + b*(1 + e_A*e_B - e_B)
    return (z', zPB', kappa')

function UNIT_SCALE(z, kappa, u):                     // (G2): u a unit of Z26
    for each letter x: z'[x] = u*z[x]
    for each j: kappa'[j] = u*kappa[j]
    return (z', kappa')

// Gauge fixing: one linear row z(X0) = 0 with kappa left free removes (G1).
// A chosen letter need not have a unit coordinate, so do not assume z(X1)=1.
// Remove (G2) by canonicalising the orbit {u z + b} after enumeration.
function CANONICAL(z):
    // translation fixed by z(A) = 0
    for each letter x: t[x] = z[x] - z[A]
    best = none
    for u in the 12 units of Z26:
        cand = [u*t[x] for x in A..Z]
        if best is none or cand < best (lexicographically): best = cand
    return best

// Controls compare recovered and planted cycles modulo the orbit, not
// literally.
function SAME_ORBIT(z_recovered, z_planted):
    return CANONICAL(z_recovered) == CANONICAL(z_planted)
```
'''

[[blocks]]
kind = "pseudocode"
title = "Observed-coordinate completion procedure"
body = '''
```text
function SOLVE_OBSERVED_MAPS(streams, phase_classes, limits):
    observed = SYMBOL_SETS_PER_INDEPENDENT_MAP(streams)
    anchors = CHOOSE_ONE_OBSERVED_SYMBOL_PER_MAP(observed)
    rows = BUILD_SAME_PHASE_DIFFERENCES(streams, anchors)
    binary, odd = COMPLETE_FIELD_SOLUTION_SPACES(rows, 2, 13)
    if either inconsistent: return INFEASIBLE
    if exact join cannot fit limits: return INCOMPLETE
    fibers = []
    for b, o in ALL_ADMITTED_FIELD_ASSIGNMENT_PAIRS(binary, odd):
        images = CRT_OBSERVED_IMAGES(b, o)
        if any map has duplicate images: continue
        intercepts = RECOVER_PHASE_VALUES_FROM_ORIGINAL_ANCHORS(images)
        require every original stream equation holds
        missing_symbols = COMPLEMENT_OF_OBSERVED_SYMBOLS(observed)
        missing_images = COMPLEMENT_OF_ASSIGNED_IMAGES(images)
        fibers.append(images, intercepts, ALL_BIJECTIONS(missing_symbols, missing_images))
    return COMPLETE_SYMBOLIC_FAMILY, fibers
function ANSWER_INVERSE_QUERIES(fiber, queried_coordinates):
    reuse known inverses and identical repeated queries
    enumerate injections from distinct unknown queries to missing symbols
    retain all remaining unused-map permutations as witness metadata
```
'''

[[blocks]]
kind = "complexity"
body = '''
The affine action on a complete dial is free, so each orbit has $12\cdot26=312$ members. A common shift reduces a period-$m$ shift-vector enumeration from $26^m$ to $26^{m-1}$ only when the objective is invariant under that shift. A physical-language score generally requires restoring the omitted shifts. These counts alone give neither a runtime bound nor a uniqueness proof.
'''

[[blocks]]
kind = "failure_modes"
title = "The translation-gauge defect"
body = '''
A word-pair solver fixed the gauge $z(C^A_0) = 0$, decrypted text B's prefix in that gauge and, in its controls, demanded the planted prefix exactly. Under $z' = u z + b$ the class decrypt of text A is invariant, but $z(P^{B\prime}) = z(P^B) - u^{-1} b\, e_A$ and $c' = u c + b(1 + e_A e_B - e_B)$: the fixed-gauge decrypt of text B is a coordinate-space Caesar rotation of the physical text, so the true cycle misses "exact prefix" in about 25 of 26 plants and its combined score is depressed. A plant proof showed, for all four sign cells, text A match $1.0$ and text B match $0.0$, with single translations $[19, 5, 10, 16]$ recovering text B uniquely. An independent confirmation found shifts 4 and 18 on another plant. The run was killed, its header-only transcript kept under the failed-runs directory, never used as a gate, and the successor maximises the prefix rate over the 26 translation gauges and compares text B modulo the orbit.

Other defects include fixing both a letter coordinate and an independent key intercept with only one translation freedom; applying the same-order additive gauge in a mixed-order cell (KAT: symmetry in 8/8 same-order cells, not a symmetry in 8/8 mixed cells); and treating an observed coincidence as a global model symmetry (a repeated 24-letter half of a latent stream makes two position maps indistinguishable on that input, so both parameter origins must be retained).
'''

[[blocks]]
kind = "controls"
body = '''
Static known-answer tests: unit gauge produces identical ciphertexts 48/48 (12 units times 4 sign cells); translation gauge reproduces both ciphertexts with text A unchanged and the predicted key shift 16/16; orbit canonicalisation 312 to 1; in a later successor the exact translation gauge was tested 20/20. Chain plants: a bank member that is a rotation of the true cycle recovers text A exactly and text B up to the predicted shift. Rotation $b = 5$ gives shift 5; $b = 9$ with $e_A = -1$ gives shift 17; a unit alias gives exact recovery. The truth gate follows this rule.

The free-dial absorption variant above has an independent algebraic proof, not a new recovery experiment. Before using it in a search implementation, exhaustively compare original and residual witness sets on a small alphabet, including sparse support, repeated positions, and a label-dependent score that requires restoring a single global alias.

For the ordered-role distinction, a hand-checkable example uses the identity dial modulo six, $a=1,b=-1$, $X=(0,1,2,3,4,5)$, $Y=(2,4,1,5,0,3)$, $W=(5,5,2,0,5,4)$ and alternating intercepts $(1,2)$. The two zero-phase readings are $(1,2,0,3,5,1)$ and $(1,3,3,5,5,1)$. Their difference is nonconstant, so their entire translation-reading sets are disjoint. Independent hand reviews verified this example and the general formula; this is not a new runtime, language-power or recovery result.
'''

[[blocks]]
kind = "example"
title = "Worked example"
body = '''
Take $e_A = e_B = +1$, so $\kappa' = \kappa + b$ and $z(P^{B\prime}) = z(P^B) - b$. With $z(P^B) = 3$, $\kappa = 2$, $z(P^A) = 4$: $z(C^B) = 5$ and $z(C^A) = 7$. Translate by $b = 5$: $z'(C^B) = 10$, $z'(C^A) = 12$, $z'(P^A) = 9$, $z(P^{B\prime}) = -2 \equiv 24$ so $z'(P^{B\prime}) = 29 \equiv 3$, and $\kappa' = 7$. Check: $z'(P^{B\prime}) + \kappa' = 3 + 7 = 10 = z'(C^B)$ and $z'(P^A) + z'(P^{B\prime}) = 9 + 3 = 12 = z'(C^A)$. Both ciphertexts and text A are unchanged; text B's letter moved by the coordinate shift $-b$.
'''

[[blocks]]
kind = "notes"
body = '''
Gauge bookkeeping is a validation matter as much as an algebraic one. The invalidation protocol is described under [Gauge-defect invalidation](/validation/gauge-defect-invalidation). See [Group actions on alphabets](/algebra/group-actions-on-alphabets) for orbit counting. The additive gauge of a keystream that is a sum of several periodic keys, with its exact rank and kernel count and the keyword reading over its orbit, is treated under [Least common multiples of periods](/algebra/lcm-of-periods).
'''

