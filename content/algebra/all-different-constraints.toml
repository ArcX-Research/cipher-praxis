id = "all-different-constraints"
section = "algebra"
title = "All-different constraints"
subtitle = "Why every letter must take a different position in an exact alphabet solver"
status = "VERIFIED"
status_note = "The one-position-per-letter rule turns a linear system over Z26 into a decision. Rank alone rejected none of 40 wrong crib pairs. The CRT version matched brute force across 538,656 solutions with 0 errors. Exact solvers using it passed 32/32 planted controls and produced exact negatives within stated scopes."
family = "Combinatorial constraints"
tags = ["all-different", "bijection", "CSP", "forward checking", "enumeration"]
related = ["modular-inverse-and-crt", "finite-field-linear-algebra", "permutation-cycles", "permutation-keystream", "residue-class-graphs", "all-different-enumeration", "constraint-satisfaction-forward-checking", "maximum-weight-bipartite-assignment", "exact-chain-oracle", "word-prefix-csp", "corpus-bank-screen", "crib-driven-alphabet-recovery", "g-all-different", "g-nullity", "symbolic-codebook-propagation", "swagman"]
summary = "An unknown cipher alphabet gives each letter its own position. Any answer must therefore satisfy an AllDifferent constraint. Assigned-value collision checks are only the first layer: Hall's condition or a covering bipartite matching can reject a partial branch even before any two assigned letters collide. Modular equations, CRT structure, and matching feasibility can be maintained together during exact search."
updated = "2026-10-06"

[[blocks]]
kind = "definition"
body = '''
For a coordinate function $z$ on the full alphabet, $\mathrm{AllDifferent}(z(A), \dots, z(Z))$ requires $z$ to be injective, hence a bijection onto $\mathbb{Z}_{26}$. In a search, a **partial assignment** must be injective on the letters assigned so far and extendable. Linear equations may be projected onto only the observed letters; then injectivity is checked on those assigned coordinates and the unused letters must be shown extendable to the unused positions. The full-key constraint still ranges over all 26 letters.
'''

[[blocks]]
kind = "equations"
body = '''
- **CRT form.** $z$ is a permutation of $0..25$ iff each residue modulo 13 occurs exactly twice and the two carriers have opposite parity. The parity requirements are linear in the $\mathrm{GF}(2)$ null-space coefficients once the $\mathrm{GF}(13)$ vector is fixed.
- **Potential form (union-find).** Maintaining $z(x) = s\, z(\mathrm{root}) + t$ with $s = \pm 1$ along accepted edges, a new edge is rejected if it forces two letters equal. A sign-mismatch cycle pins the root to a solution of $2z = c$, and a pinned root must admit a collision-free value.
- **Hall form.** Let each unassigned letter $x$ have its current allowed-position set $D_x$. An injective completion exists only if

$$\left|\bigcup_{x\in S}D_x\right|\ge |S|\qquad\text{for every set of letters }S.$$

For a finite bipartite domain graph, this condition is equivalent to a matching that covers every unassigned letter. A failed covering-matching test is therefore an exact rejection. Passing it proves extendability for the current domains alone; other modular equations may still fail later.
- **Key-free shadow.** Bijectivity of $z$ implies, within one key class, $C_i = C_j \Leftrightarrow P_i = P_j$. The equality partitions of ciphertext and plaintext must agree. This is the necessary condition tested before any algebra.
- **Cycle-type shadow.** A single 26-cycle solution must have no closed sub-cycle in any partial map (see [Permutation cycles](/algebra/permutation-cycles)).
'''

[[blocks]]
kind = "variants"
title = "A constant-size Hall test for ternary coordinate words"
body = '''
For a three-coordinate word over three values, within-word equalities restrict its numeric domain to one of five kinds: the all-equal diagonal $D$ (three cells), one of the equality planes $01$, $02$ or $12$ (nine cells each), or the unrestricted set (27 cells). A plane includes the diagonal: these are required equalities, not assertions that every other coordinate differs.

Let their counts be $n_D,n_{01},n_{02},n_{12},n_F$. A matching of distinct words to distinct cells exists exactly when the total count is at most 27 and

$$n_D+\max(0,n_{01}-6)+\max(0,n_{02}-6)+\max(0,n_{12}-6)\le3.$$

Each plane has six cells outside the diagonal; these three exclusive sets are disjoint. Use those cells first, place the remaining restricted words on the three diagonal cells, then place unrestricted words in any unused cells. The same capacity argument proves necessity. This replaces generic matching only for these exact domain shapes. Shared variables between words and additional restrictions still require other checks.

For binary coordinate words, a useful sufficient shortcut is that the number of restricted words does not exceed the smallest restricted-domain size, provided the total number of words does not exceed the cell count. Then every subset's union has enough cells. Otherwise run exact matching; do not reject merely because the shortcut fails. [Symbolic codebook propagation](/exact/symbolic-codebook-propagation) handles shared-variable implications that these domain tests omit.
'''

[[blocks]]
kind = "assumptions"
body = '''
- One alphabet; with several unrelated alphabets the constraint applies per alphabet and is much weaker.
- The linear relations are exact. A single wrong crib letter turns a feasible system into an infeasible one, which is the point.
- Domain sets used by the Hall check already include every currently known modular and pairwise restriction. Omitting a restriction weakens pruning; inventing one can remove a real solution.
- A covering matching is recomputed or incrementally repaired after domain changes. Checking only the number of unused positions misses Hall deficits shared by several letters.
'''

[[blocks]]
kind = "attack"
body = '''
1. Solve the linear relations over $\mathrm{GF}(2)$ and $\mathrm{GF}(13)$ and enumerate only permutation lifts. A guess whose null space admits no permutation is rejected exactly.
2. Retain **every** distinct all-different read of a system for later ranking.
3. In depth-first word or block assignment, check injectivity of each observed residue map after every assignment, run cheap Hall subsets or a covering-matching test on remaining domains, and run the CRT feasibility test on the incremental modular state. Defer, never reject, a branch whose exact feasibility test exceeds its cap.
4. Use the equality-partition gate and the collision implications as free pre-filters on candidate texts.
5. Score survivors by language only after the exact stage, and require independent forwards.
'''

[[blocks]]
kind = "pseudocode"
body = '''
```text
function INJECTIVE(values):
    return size(set(values)) == size(values)
function IS_PERMUTATION_CRT(z):
    for residue = 0..12:
        carriers = letters x with z[x] mod 13 == residue
        if size(carriers) != 2: return false
        if the two carriers have the same parity: return false
    return true
function HALL_FEASIBLE(domains):
    if domains have exactly the five ternary equality-domain shapes:
        (diag,pair01,pair02,pair12,free) = CLASS_COUNTS(domains)
        overflow = sum(max(0,count-6) for count in [pair01,pair02,pair12])
        return size(domains) <= 27 and diag+overflow <= 3
    matching = MAXIMUM_CARDINALITY_MATCHING(domains)
    return size(matching) == size(domains)
function EQUALITY_PARTITION_GATE(C,P,positions):
    for i,j in positions with i < j:
        if (C[i] == C[j]) != (P[i] == P[j]): return REJECT
    return PASS
function PARTIAL_BRANCH_FEASIBLE(assigned,domains,modular_state):
    if not INJECTIVE(assigned): return REJECT
    if not HALL_FEASIBLE(domains): return REJECT
    result = CRT_FEASIBLE(modular_state)
    if result exceeded its cap: return DEFER
    return result
```
'''

[[blocks]]
kind = "complexity"
body = '''
Exact crib-pair solver: 245,766 pairs, all linearly consistent, resolved only by enumeration; its $f_{13} = 5$ tail processed 8,851 systems at $13^7$ each. Shift-free crib solver: 52,100 exact solves at about $0.01$ s each. Corpus screen: 40,331 offsets (39,528 unique prefixes) passed through the exact oracle under all four sign pairs. Depth-first shared-cycle solver on a 96-letter zone: 73,528 tasks and 793,712,197 nodes (Vigenère-type), 33,540 tasks and 47,310,816 nodes (Beaufort-type), both complete.
'''

[[blocks]]
kind = "failure_modes"
body = '''
- **Non-injective potentials pass every linear check.** Without the all-different test the potential $z' = 2z$ with keys $k' = 2k$ was fully consistent with the relations. Only injectivity exposed it.
- **Keeping only the best partial read.** A planted system whose true read ranked 2nd of 6 all-different reads was lost under that rule. The corrected rule retains all reads.
- **Rejecting on cap exhaustion** instead of deferring the branch.
- **Single-word guesses.** One English word of up to about 20 letters leaves nullities far too large to enumerate; exact rejection needs two long cribs or one crib plus enough fixed letters.
- **Assigned-only collision check.** Three unassigned letters may all be restricted to the same two positions; no assignment collision exists yet, but Hall's condition already proves failure.
- **Counting free labels only.** The total number of free positions is large enough, but a subset of letters shares too small a union of domains.
- **Matching called full feasibility.** A covering matching exists for the current domains, but coupled modular equations not represented by those domains can still make the branch impossible.
'''

[[blocks]]
kind = "controls"
body = '''
CRT factorisation set-identical to full-product enumeration and to brute force over 240 systems / 538,656 solutions. Exact crib solver 32/32 at crib length 26; live screen of 26,050 corpus openings under both signs yielded 0 feasible prefixes (a scoped negative for verbatim openings). Tail-continuation KAT: planted $f_{13} = 5$ pair recovered at index 1,459 of 3,482 systems; target: 8,851 systems, zero all-different reads, no candidate. Depth-first solver: identity-permutation positive KAT, differential enumeration KAT, two blind planted endpoints found after 27,361 of 63,629 and 110 of 78,002 tasks; live traversals complete with zero endpoints and zero over-cap terminals in both relations.
'''

[[blocks]]
kind = "example"
title = "Worked example"
body = '''
Gauge $z(A) = 0$. Relations $z(B) - z(A) \equiv 13$ and $z(C) - z(B) \equiv 13$ give $z(B) = 13$ and $z(C) = 26 \equiv 0 = z(A)$: linearly consistent, but $A$ and $C$ collide, so the system has no permutation solution and is rejected. In CRT terms $z(A) = (0, 0)$ and $z(B) = (1, 0)$ share residue 0 modulo 13 with opposite parities (allowed), while $z(C) = (0, 0)$ duplicates $z(A)$ (forbidden). Replacing the second relation by $z(C) - z(B) \equiv 5$ gives $z(C) = 18 = (0, 5)$, and all three coexist.
'''

[[blocks]]
kind = "notes"
body = '''
The corpus's rule of thumb: rank guesses by enumeration cost ($f_{13}$), never by consistency; require at least two cribs before calling a rejection exact; keep every read. The exact machinery is described under [All-different enumeration](/exact/all-different-enumeration) and [Exact chain oracle](/exact/exact-chain-oracle).
'''

