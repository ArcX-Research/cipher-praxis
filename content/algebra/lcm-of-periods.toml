id = "lcm-of-periods"
section = "algebra"
title = "Least common multiples of periods"
subtitle = "How repeating keys combine and change when positions are sampled"
status = "VERIFIED"
status_note = "The lcm, gcd, and coprime-residue rules are exact. Compound-key controls reached z +51 and +27, while target tests found nothing for inner periods 2 to 13. The same rules support the remaining-period screen after alignment and the residue-graph solvers. The rank and gauge count for a sum of several periodic keys is a derivation checked exactly for periods 4, 5, 6 and 7 (rank 18, nullity 4 over both prime fields) and the keyword reading over that gauge orbit is an exact enumeration on one solved text."
family = "Number theory"
tags = ["period", "lcm", "gcd", "decimation", "compound key", "coprime", "gauge", "rank"]
related = ["residue-class-graphs", "linear-recurrences-lcg", "matrix-invertibility-mod-26", "modular-inverse-and-crt", "compound-periodic-key", "additive-stream-wheels", "vigenere", "exact-period-alignment", "kasiski-examination", "coincidence-lag-profile", "g-residue-class", "g-coset", "sum-of-periodic-keys", "linear-keystream-crib-solve", "conjugacy-and-gauge", "gauge-defect-invalidation", "finite-field-linear-algebra", "dictionary-attack", "parameter-versus-plaintext-recovery", "g-gauge-freedom", "g-nullity"]
summary = "Add two repeating keys and the result repeats after the least common multiple of their admitted periods. Read every n-th value from a period-p stream and the subsequence has period p/gcd(p,n). Either sequence may have a smaller minimal period because of accidental symmetry. If two periods are coprime, one full residue cycle visits every pair of remainders exactly once."
updated = "2026-09-09"

[[blocks]]
kind = "definition"
body = '''
A sequence has period $m$ if $k_{i+m}=k_i$ for all $i$; this need not be its least positive period. If $k$ has period $m$ and $k'$ has period $q$, then $k+k'$ has period $\operatorname{lcm}(m,q)=mq/\gcd(m,q)$, so its minimal period divides that value. **Decimation**: the subsequence $k_{nj}$ has period $p/\gcd(p,n)$ when $p$ is a period of $k$; again, its minimal period may be a divisor. **Coprime residues**: for $\gcd(m,q)=1$ the map $i\mapsto(i\bmod m,i\bmod q)$ is a bijection from $\{0,\dots,mq-1\}$ onto $\mathbb{Z}_m\times\mathbb{Z}_q$.
'''

[[blocks]]
kind = "equations"
body = '''
- **Compound periodic key.** An outer period-7 layer over an inner period-$q$ layer (one or two alphabets) has admitted period $\operatorname{lcm}(7,q)$; for $q=10$ that is 70. Its minimal period can be smaller for special key values.
- **Rank-two modulation.** $u[i\bmod7]+v[(i+\phi)\bmod9]$ has period dividing 63 and uses 16 stored entries. The gauge $u_r\mapsto u_r+t$, $v_s\mapsto v_s-t$ leaves the stream unchanged, so at most 15 additive degrees of freedom are identifiable. In a two-text model that shares the same $v$ table and phase, an aligned difference at equal modulo-9 residues cancels that term; without those assumptions it does not.
- **Coprime bijection.** For period-7 and period-9 keys aligned over 63 positions, $i \mapsto (i \bmod 7, (\phi + \tau i) \bmod 9)$ is a bijection for every phase $\phi$ and both orientations $\tau = \pm 1$. The residue graph is the complete bipartite $K_{7,9}$ with 63 edges. For periods 26 and 7 the graph on $26 + 7 = 33$ vertices is connected for every $n \ge 63$ and has cycle rank $n - 32$.
- **Decimation in block ciphers.** Row streams of an $n\times n$ Hill matrix over an inner additive layer with admitted period $p$ have period $p/\gcd(p,n)$, possibly nonminimal.
- **Divisors of text lengths.** Widths that tile a text exactly: 153: 3, 9, 17; 144: 2, 3, 4, 6, 8, 9, 12, 16, 18, 24; 504: 2, 3, 4, 6, 7, 8, 9, 12, 14, 18, 21, 24, 28 (widths 2 to 29).
'''

[[blocks]]
kind = "equations"
title = "Rank and gauge of a sum of several periodic keys"
body = '''
Stack $r$ component keys of periods $p_1, \dots, p_r$ into $\theta \in \mathbb{Z}_{26}^{\sum_j p_j}$ and write the summed keystream as $k = M\theta$, $k_i = \sum_j u^{(j)}_{i \bmod p_j}$, where $M$ is the $n \times \sum_j p_j$ design matrix with one 1 per period block in each row. Its image is $V_{p_1} + \dots + V_{p_r}$, the sum of the spaces of period-$p_j$ sequences, and its kernel is the **gauge**: every $\theta$ in a coset $\theta + \ker M$ gives the same keystream and therefore the same ciphertext for every plaintext.

- **Rank.** Every element of the sum satisfies the linear recurrence with characteristic polynomial $\operatorname{lcm}_j(x^{p_j} - 1)$, and the solution space of that recurrence is exactly the sum, so the rank is the degree of that polynomial. With $D$ the set of all divisors of the periods, $\operatorname{lcm}_j(x^{p_j} - 1) = \prod_{d \in D} \Phi_d(x)$ over the rationals and

$$\operatorname{rank} M = \sum_{d \in D} \varphi(d)$$

once the text contains at least that many consecutive positions. The count survives reduction modulo 2 and modulo 13: for each $d$ coprime to the prime $\ell$, the exponent of the reduced $\Phi_d$ sums $\varphi(\ell^b)$ over the divisors $d\ell^b$ present in $D$, and that sum is $\ell^B$ with $\ell^B$ the largest power of $\ell$ for which $d\ell^B$ still divides one of the periods. For $\{4, 5, 6, 7\}$, $D = \{1, \dots, 7\}$ and the rank is $1 + 1 + 2 + 2 + 4 + 2 + 6 = 18$ over both fields, reached with 18 consecutive positions.
- **Nullity and kernel.** $\dim \ker M = \sum_j p_j - \sum_{d \in D} \varphi(d)$, which is $22 - 18 = 4$ for $\{4, 5, 6, 7\}$. Since $V_p \cap V_q = V_{\gcd(p,q)}$ (a sequence with two periods has their gcd as a period), the kernel is generated by moving a sequence of period $\gcd(p_j, p_l)$ from component $j$ to component $l$: constants give $r - 1$ transfers and each non-constant shared-divisor sequence adds one more. For $\{4, 5, 6, 7\}$ only $\gcd(4, 6) = 2$ exceeds 1, so the kernel is three constant transfers $(u, v, w, -(u+v+w))$ plus one alternation, $(+t, -t, +t, -t)$ on the period-4 key with $(-t, +t, -t, +t, -t, +t)$ on the period-6 key. The two-key modulation above (16 stored entries, 15 identifiable) is the same count with $D = \{1, 3, 7, 9\}$.
- **Identifiable content.** The keystream carries $\operatorname{rank} M$ free residues, $18 \log_2 26 \approx 84.6$ bits here, and any $\operatorname{rank} M$ consecutive keystream values determine the rest through the recurrence; the raw components carry $26^{\dim \ker M}$ equivalent descriptions. Controls must compare keystreams, never components letter for letter ([Gauge-defect invalidation](/validation/gauge-defect-invalidation)).
- **Reading keywords over the orbit.** If the setter used keywords, the orbit points where every component spells a word reveal them: for a gauge vector $z \in \ker M$, a sign $\sigma \in \{\pm 1\}$ and a reading alphabet $A$, component $j$ reads as $A[\sigma(u^{(j)}_t + z^{(j)}_t)]$ for $t = 0, \dots, p_j - 1$. Enumerating the $26^{\dim \ker M}$ gauge points and both signs against word lists of the component lengths ($2 \cdot 26^4 = 913{,}952$ readings for $\{4, 5, 6, 7\}$, with the two components that depend on a single constant filtered first) found exactly one all-word decomposition on the solved 153-letter corpus text, read in the keyed alphabet with the sign opposite to the solver's convention. All orbit points re-encrypt identically, so the word criterion is the only evidence for the reading and the number of accepting points must be reported.
'''

[[blocks]]
kind = "assumptions"
body = '''
- Components are strictly periodic over the region analysed. A change point splits the analysis into zones.
- Alignment origins are known up to phase. A phase is a key-label nuisance absorbed by relabelling residues.
'''

[[blocks]]
kind = "attack"
body = '''
1. **Residual periodicity.** After the exact period-7 alignment removes the outer shifts, test the aligned text at every $q = 2..30$ for a second additive period by aligned coincidence against shuffles.
2. **Compound solver.** Fit the outer period-7 key and an inner period-$q$ key jointly (start-free alternating class fit, quadgram polish, shuffled nulls) for $q = 2..13$ in one or two alphabets.
3. **Residue graphs.** Use the coprime bijection to build the complete edge set and its cycle basis: 48 rectangles for $K_{7,9}$, or one winding equation plus $n - 33$ four-term relations for periods 26 and 7.
4. **Grid widths.** Restrict transposition widths to exact divisors when the construction requires a full rectangle.
5. **Sum of several keys.** Compute the design matrix, its rank and a kernel basis over both prime fields rather than assuming the counts; solve with the gauge fixed by one row per kernel generator, or work with the keystream only ([Sum of periodic keys](/ciphers/sum-of-periodic-keys), [Exact crib solve of a linear keystream](/cryptanalysis/linear-keystream-crib-solve)). To read keywords, loop over the components with the fewest gauge parameters first, reject as soon as one word is missing from the list of its length, and record every accepting point for each sign and reading alphabet.
'''

[[blocks]]
kind = "pseudocode"
body = '''
```text
function GCD(a, b):
    while b != 0: (a, b) = (b, a mod b)
    return a

function LCM(m, q):
    return m*q / GCD(m, q)

// Sum of a period-m key k and a period-q key k': one key whose period divides
// lcm(m, q).
function COMBINE(k[0..m-1], k'[0..q-1]):
    T = LCM(m, q)
    for i in 0..T-1:
        // reduce mod 26 for alphabet keys
        s[i] = k[i mod m] + k'[i mod q]
    return s                                          // s[i + T] = s[i]

// s is known to repeat with period T
function MINIMAL_PERIOD(s[0..T-1]):
    for d in divisors of T (ascending):
        if s[i] == s[i mod d] for all i in 0..T-1: return d

// Decimation: every n-th value of a period-p sequence has period p / gcd(p,
// n).
function DECIMATE(k[0..p-1], p, n):
    return [k[(n*j) mod p] for j in 0..(p / GCD(p, n)) - 1]

// Coprime residues: for gcd(m, q) = 1, i -> (i mod m, i mod q) is a bijection
// from {0, ..., mq - 1} onto Z_m x Z_q (the CRT on positions).
function RESIDUE_PAIR(i, m, q):
    return (i mod m, i mod q)
```
'''

[[blocks]]
kind = "pseudocode"
title = "Rank, gauge and keyword reading of a summed key"
body = '''
```text
// Design matrix of periods p[1..r] on n positions: one 1 per period block.
function DESIGN_MATRIX(p, n):
    for i in 0..n-1:
        col = 0
        for j in 1..r: M[i][col + (i mod p[j])] = 1; col = col + p[j]
    return M

// Rank and kernel over both prime fields; the Z26 kernel is their CRT lift.
// Expected rank: sum of PHI(d) over every divisor d of any period.
function GAUGE(p, n):
    M = DESIGN_MATRIX(p, n)
    for q in {2, 13}: (rank[q], kernel[q]) = RREF_NULLSPACE(M mod q, q)
    return (rank, kernel)

// Keyword reading: components u[1..r], kernel basis, word lists W[len],
// reading alphabet A; every accepted point generates the same keystream.
function ORBIT_WORD_SEARCH(u, kernel_basis, W, A):
    hits = []
    for sigma in {+1, -1}:
        for each coefficient vector over kernel_basis:          // 26^g points
            z = that combination of kernel_basis; ok = true
            for j in components ordered by fewest gauge parameters:
                word = letters A[(sigma*(u[j][t] + z[j][t])) mod 26], t < p[j]
                if word not in W[p[j]]: ok = false; break
            if ok: hits.append((sigma, z))
    return hits                                  // report the count
```
'''

[[blocks]]
kind = "complexity"
body = '''
Parameters versus values: a compound $7\times q$ key has $7+q$ stored shifts but one additive gauge when only their sum is observed; it produces $\operatorname{lcm}(7,q)$ indexed key values, not necessarily that many distinct residues. The period-63 modulation likewise has 16 stored entries and 15 identifiable additive degrees of freedom. The compound search covers $q=2..13$ in four alphabet pairings. A heuristic information count for the shared-modulation coupling of two texts gave about 25 bits of evidence over 2,448 cross pairs against 61 bits of free shifts. It was later marked heuristic, not a theorem, with the supported statement being the empirical 0/6 recovery of the potentials. Row reduction of the design matrix of a summed key costs $O(n(\sum_j p_j)^2)$ per field; the keyword reading enumerates $2 \cdot 26^{\dim \ker M}$ points with early rejection, seconds in an interpreted implementation for $\{4, 5, 6, 7\}$.
'''

[[blocks]]
kind = "failure_modes"
body = '''
- A maximum over $q = 2..30$ inflates residual peaks. One text's residual peaks at $q = 10$ ($z = +3.7$ and $+4.3$ in the two alphabet orders after alignment) were followed up by the compound solver and closed, not reported as structure.
- Wrong-period graphs: a common-plaintext solver run with periods 26 and 9 on data generated at 26 and 7 stays connected and exactly recoverable, so a false hit would not be hidden by topology. The control returned zero classes over 704 geometries.
- Treating the bit-count identifiability argument as formal; coincidences are not independent and the KL of the full 26-ary difference is larger than the coincidence-only value.
- Treating $\sum_j p_j$ as the key size of a summed key, or comparing recovered components literally in a control, when only the keystream is identifiable; a period that divides another adds no keystreams and should not be enumerated as a separate set.
- Reading keywords in the wrong alphabet or sign: the recorded components spell words only in the keyed alphabet and only with the sign opposite to the solver's; short components can pass at several orbit points, so a unique reading must be shown, not assumed, and a reading changes no plaintext letter ([Parameter recovery versus plaintext recovery](/cryptanalysis/parameter-versus-plaintext-recovery)).
'''

[[blocks]]
kind = "controls"
body = '''
Compound solver controls: a period-70 key (outer 7 over inner 10, one alphabet) and a two-alphabet 7-over-10 key recovered at $z = +51.1$ and $+26.7$ with 100 % match; target texts nothing for $q = 2..13$ in any alphabet pairing. Residual periodicity screen: recorded per text and order for $q = 2..30$. Mixed-period graph controls: four positives (153, 63, 144, 96 letters) recovered exact cycle, both keys and plaintext with one exact affine class each. The wrong-period negative and a within-residue shuffle negative gave zero classes over 704 and 884 geometries.

Summed-key algebra, checked exactly on the solved 153-letter text with periods $\{4, 5, 6, 7\}$: rank 18 and nullity 4 over $\mathrm{GF}(2)$ and over $\mathrm{GF}(13)$ from the 153 known-plaintext rows; the explicit kernel (three constants plus the shared alternation); uniqueness of the keystream from an 18-letter crib, checked by verifying that every kernel vector of the crib system generates the zero keystream on all positions; a wrong plaintext of the same length inconsistent over both fields; and exactly one all-word decomposition among the $2 \cdot 26^4$ orbit readings, whose re-encryption reproduces the ciphertext. The production worker verifies the derived recurrence against every column of $M$ over the whole text before use.
'''

[[blocks]]
kind = "example"
title = "Worked example"
body = '''
$k = (1, 2, 3, 4)$ of period 4 and $k' = (0, 5, 7, 2, 9, 4)$ of period 6, $\operatorname{lcm}(4, 6) = 12$. Their sum over $i = 0..11$: $1, 7, 10, 6, 10, 6, 3, 9, 8, 4, 12, 8$, and $i = 12$ gives $1 + 0 = 1$ again. No smaller period works: positions 0 and 4 differ ($1 \ne 10$), so not 4; positions 0 and 6 differ ($1 \ne 3$), so not 6.

Coprime bijection: with $m = 7$, $q = 9$, position $i = 20$ maps to $(6, 2)$ and $i = 41$ to $(6, 5)$. The 63 positions $0..62$ hit each of the $7 \cdot 9 = 63$ residue pairs exactly once. Decimation: a period-12 sequence read every third position has period $12/\gcd(12, 3) = 4$.

Gauge of a summed key: periods 4 and 6 share the divisor 2. With the period-4 key $(1, 2, 3, 4)$ and the period-6 key $(0, 5, 7, 2, 9, 4)$ from above, add $(+3, -3, +3, -3)$ to the first and $(-3, +3, -3, +3, -3, +3)$ to the second: $(4, 25, 6, 1)$ and $(23, 8, 4, 5, 6, 7)$ modulo 26. Position 1 gives $25 + 8 = 33 \equiv 7$ and position 5 gives $25 + 7 = 32 \equiv 6$, the original sums; here $\sum_j p_j = 10$, $D = \{1, 2, 3, 4, 6\}$ with $\varphi$-sum 8, nullity 2 (one constant transfer, one alternation).

Keyword reading: in the alphabet keyed by `ZEBRAS` (`ZEBRASCDFGHIJKLMNOPQTUVWXY`) suppose a solver returned the period-3 and period-4 components as `HCG` and `MCBV`, positions $(10, 6, 9)$ and $(15, 6, 2, 22)$. The kernel is one constant transfer, so the orbit has 26 points per sign: add $u$ to the first component and subtract it from the second. Against a small list containing `SEA`, `TEA`, `EAT`, `SET`, `TIDE`, `DIET`, `EDIT`, `TIED`, `DATE`, `SEAT`, `EAST`, exactly one point passes, $\sigma = +1$ and $u = 21$, reading `SEA` and `TIDE`: $10 + 21 = 31 \equiv 5$ is `S` and $15 - 21 = -6 \equiv 20$ is `T` in this alphabet, and all 52 points generate the same keystream.
'''

[[blocks]]
kind = "notes"
body = '''
The coprime bijection is the same theorem as the Chinese remainder theorem for positions rather than letters; see [Modular inverses and CRT](/algebra/modular-inverse-and-crt). Cipher models built on composed periods are described under [Compound periodic key](/ciphers/compound-periodic-key). A keystream built from several such keys whose combined period exceeds the text is the [sum of periodic keys](/ciphers/sum-of-periodic-keys); the rank and gauge above are what its [exact crib solve](/cryptanalysis/linear-keystream-crib-solve) relies on, and the general gauge vocabulary is in [Conjugacy and gauge freedom](/algebra/conjugacy-and-gauge).
'''

