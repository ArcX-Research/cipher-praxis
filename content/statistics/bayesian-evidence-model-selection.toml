id = "bayesian-evidence-model-selection"
section = "statistics"
title = "Bayesian evidence and model selection"
subtitle = "Compare models by averaging over key shifts instead of choosing the best shifts"
status = "VERIFIED"
status_note = "The implementation covers inner models with one, two, or three rotations and averages all coset shifts under a uniform prior. In planted checks, one rotation wins for a plain periodic substitution at z +12.3 against shuffles. Two rotations win for layered controls at z +5.6 to +8.5. Inner spacing is correct for 7 of 8 seeds. Fractionated inner text leaves every family near z 0."
family = "Bayesian evidence and model selection"
tags = ["evidence", "marginal likelihood", "model comparison", "Bayes factor", "shift marginalisation"]
related = ["quadgram-log-likelihood", "index-of-coincidence", "family-wise-null", "selection-overfit-diagnostic", "mixture-inference-under-transposition", "order-free-width-statistic", "expectation-maximisation", "exact-period-alignment", "g-evidence", "g-marginal-likelihood", "g-nats-per-letter", "periodic-key-marginal-likelihood"]
summary = "Bayesian evidence averages a model’s likelihood over its full declared key prior instead of reporting only the best fit. Model-bank priors and parameter multiplicities affect that average. Evidence comparisons require compatible likelihoods, explicit priors and a matching null model."
updated = "2026-09-08"

[[blocks]]
kind = "definition"
body = '''
Split the ciphertext into $p$ cosets with letter counts $F_b(x)$, $b = 0 \dots p-1$. A model of the inner text is a 26-vector $f$ (a probability distribution in the alphabet order of the outer layer). Under an unknown shift $s_b$ the coset is drawn from $f(x - s_b)$, so

$$Z_b(f) = \frac{1}{26}\sum_{s=0}^{25} \prod_x f(x - s)^{F_b(x)}, \qquad \log Z(f) = \sum_{b} \log Z_b(f).$$

The **gain** is the evidence per letter over the uniform model, $g(f) = \big(\log Z(f) + n \ln 26\big)/n$ in nats per letter. A *family* is a bank of models $\{f_1, \dots, f_M\}$ with a uniform prior; its evidence is the log-mean-exp

$$\log Z_{\text{fam}} = \log \frac{1}{M}\sum_{m=1}^{M} Z(f_m),$$

When one member dominates the sum, averaging rather than maximising reduces its contribution by about $\ln M$ nats. This is not a universal penalty based only on bank size: duplicating members, changing the weights, or changing the bank changes the prior and therefore the evidence.
'''

[[blocks]]
kind = "equations"
title = "Banks, delta-marginal and posteriors"
body = '''
With $E$ the English monogram distribution and $E_g$ its rotation by $g$:

- **M1** (rotated English): $\{E_g\}$, $M = 26$.
- **M2** (two-rotation mixture): $\{w E_{g_1} + (1-w) E_{g_2}\}$ over $g_1 < g_2$ and a weight grid, $M = 325$ at $w = 1/2$.
- **M3** (three-rotation mixture): $\{(E_{g_1} + E_{g_2} + E_{g_3})/3\}$, $M = 2{,}600$.

For M2 the **delta-marginal** evidence groups members by the inner spacing $\delta = \min(g_2 - g_1,\ g_1 - g_2) \bmod 26$ and reports $\log Z$ per group. A real two-rotation inner shows one $\delta$ well above the rest. Per coset, the shift posterior is $\Pr(s_b \mid F_b) \propto \prod_x f(x - s_b)^{F_b(x)}$; per letter, the class posterior $\Pr(\text{component} \mid \text{letter})$ under the MAP member feeds the [order-free width statistic](/cryptanalysis/order-free-width-statistic).

**Profiling versus marginalising.** Replacing $\frac{1}{26}\sum_s$ by $\max_s$ in $Z_b$ gives the profile likelihood; at $n = 153$ it exceeds the evidence by about $0.15$ nats per letter on average, which is why the profile picks wrong families on shuffled texts.
'''

[[blocks]]
kind = "assumptions"
body = '''
- Letters inside a coset are modelled as exchangeable draws from one rotated distribution. Under that iid-monogram model, a transposition below the periodic layer changes order but not the likelihood. Real prose is not iid, so this invariance belongs to this order-free model rather than to every language model.
- The outer layer is additive in a known alphabet order (or in each of a small set of orders tried separately).
- A uniform prior over shifts and over bank members. The evidence differences quoted are sensitive to the bank definition, so families are compared against nulls computed with the identical banks.
'''

[[blocks]]
kind = "attack"
title = "How to attack it"
body = '''
1. **Periodic gate.** In the cascade solver the best M1 gain over periods $2 \dots p_{\max}$, two alphabet orders and both relations is compared with the family-wise maximum of the same scan over shuffled texts. The decision fires when the gain clears that maximum by $0.02$ nats per letter. On the solved references the gains were $+0.255$, $+0.216$, $+0.229$ and $+0.080$ against shuffled maxima of $+0.024$, $+0.005$, $+0.010$ and $-0.015$.
2. **Family comparison.** Compute the M1, M2, M3 family evidences and their differences; read the $\delta$-marginal; carry the top three $\delta$ forward.
3. **Class posteriors and EM.** Assign each letter a component; test transposition widths order-free; re-estimate each coset's shift from the class-conditional likelihood (class-EM), which corrected the one or two wrong cosets on controls (7 of 7 after EM).
4. **Nulls.** Push shuffled ciphertexts through the identical fit, $\delta$ selection, EM and width scan, so every reported $z$ is a complete-pipeline null.
'''

[[blocks]]
kind = "pseudocode"
body = '''
```text
// F[b][x] = count of letter x in coset b (b = 0..p-1); n = total letters; f =
// a 26-vector model of the inner text. Shift sums are taken in log space with
// LOG_MEAN_EXP.
function LOG_Z_COSET(F_b[0..25], f[0..25]):
    for s in 0..25:
        loglik[s] = sum over x of F_b[x] * log f[(x - s) mod 26]
    // = log( (1/26) * sum over s of exp(loglik[s]) )
    return LOG_MEAN_EXP(loglik[0..25])

function LOG_Z(F[0..p-1], f):
    return sum over b of LOG_Z_COSET(F[b], f)

// evidence per letter over the uniform model
function GAIN(F, f, n):
    return (LOG_Z(F, f) + n * ln(26)) / n

// Family evidence: uniform prior over the bank f_1..f_M; the log-mean-exp
// charges ln M.
function LOG_Z_FAMILY(F, bank[1..M]):
    for m in 1..M:
        logz[m] = LOG_Z(F, bank[m])
    return LOG_MEAN_EXP(logz[1..M])

// Per-coset shift posterior under one model (feeds the class posteriors and
// class-EM).
function SHIFT_POSTERIOR(F_b, f):
    for s in 0..25:
        loglik[s] = sum over x of F_b[x] * log f[(x - s) mod 26]
    return NORMALISE(exp(loglik[s] - max(loglik)) for s in 0..25)

// Replacing LOG_MEAN_EXP by max over s gives the profile likelihood, which is
// not the evidence.
```
'''

[[blocks]]
kind = "complexity"
body = '''
For a bank of $M$ members the coset log-likelihood table is $M \times p \times 26$ and is computed as one tensor contraction with the $p \times 26$ count matrix (chunked over members). A full run of the mixture pipeline with 60 null pipelines and widths up to 25 took 17–28 s per control at 153 letters.
'''

[[blocks]]
kind = "failure_modes"
body = '''
- **Evidence differences have their own null.** On shuffled texts the mixture family beats the single-rotation family by $+0.13$ to $+0.17$ nats per letter, because a shuffle flattens every coset and a mixture fits a flat histogram better. Judge each family against its own shuffled distribution; on a plain periodic substitution $M2 - M1 = -0.080$ against a shuffled $+0.131 \pm 0.027$ is the decisive reading, not the sign of the raw difference.
- **Flat inner text.** A fractionated inner (a bifid-like layer under the periodic key) leaves all three families at $z \approx 0$: the test says "not rotated English and not a small mixture", nothing more.
- **Pure transposition.** The shuffle preserves the letter multiset, so on an untransposed-substitution-free text the observed gain and the null saturate together and the gate stays quiet, correctly.
- **False pattern at the largest period.** If every text gets its best gain at the largest period tried, selection is probably creating the result. It is not evidence of a real signal (see the [selection-overfit diagnostic](/statistics/selection-overfit-diagnostic)).
'''

[[blocks]]
kind = "controls"
body = '''
At 153 letters, 60 null pipelines each: plain periodic substitution, M1 gain $+0.2849$ (shuffled $-0.1412 \pm 0.0347$, $z = +12.3$); planted sandwich with an exact $17 \times 9$ grid, M2 $+0.0510$ ($z = +5.6$) with M1 $-0.0840$ ($z = +2.4$); ragged width 8, M2 $+0.0471$ ($z = +4.7$); width 12 with the inner in the other alphabet order, M2 $+0.0802$ ($z = +8.5$); period-3 inner, M3 $+0.0231$ ($z = +3.3$); bifid inner, all families $|z| \le 0.3$. All four solvable controls were solved from cold with the true width on top ($z$ from $+4.3$ to $+12.8$) and 100% plaintext match at rate $-4.34$.
'''

[[blocks]]
kind = "example"
title = "Worked example: comparing two families"
body = '''
On the plain periodic-substitution control the family evidences per letter were $g_{M1} = +0.2849$ and $g_{M2} = +0.2050$ nats. Over $n = 153$ letters the log Bayes factor is

$$153 \times (0.2849 - 0.2050) = 12.2 \text{ nats}, \qquad B_{12} = e^{12.2} \approx 2 \times 10^{5}$$

in favour of the declared rotated-English bank over the declared equal-weight two-rotation bank. The reported M2 bank fixes $w=1/2$ and distinct rotations, so it does **not** contain M1 as a limiting case. The averaging effect is easy to see: if one member of a bank of $M$ fits far better than the rest, $\log Z_{\text{fam}} \approx \log Z_{\text{best}} - \ln M$; for M2, $\ln 325 = 5.78$ nats, i.e. $0.038$ nats per letter at $n = 153$, and for M3 $\ln 2{,}600 = 7.86$ nats, $0.051$ per letter. Those comparisons are conditional on the uniform bank priors.

A shift-marginalised coset evidence in miniature: a coset of three identical letters under the English model has $Z_b = \frac{1}{26}\sum_s E(x - s)^3 = \frac{1}{26}\sum_y p_y^3 = 0.00535/26 = 2.1 \times 10^{-4}$, whatever the letter is, against the uniform $(1/26)^3 = 5.7 \times 10^{-5}$: a gain of $\ln(3.6)/3 \approx 0.43$ nats per letter. The evidence depends only on the shape of the coset histogram (three equal letters), never on which letter, which is exactly the invariance that makes it order-free and free of the rotation gauge.
'''

[[blocks]]
kind = "notes"
body = '''
The design principle is *evidence, not likelihood*: every parameter that the analyst would otherwise tune by hand (shift, spacing, weight) is integrated out, and what remains is compared with the same integration on nulls. The word "gain" in the transcripts means evidence per letter over the uniform model.
'''

